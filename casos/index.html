<style>
/* Layout: una columna de móvil; fondo agrupado gris claro, tarjetas blancas sin borde, tipografía del sistema, un solo color de acento. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --ink:#000000; --muted:#6E6E73; --line:rgba(60,60,67,.14);
  --accent:#007AFF; --accent-ink:#FFFFFF; --soft:rgba(0,122,255,.10); --fill:rgba(120,120,128,.12);
  --good:#248A3D; --good-soft:rgba(52,199,89,.14); --bad:#D70015; --bad-soft:rgba(255,59,48,.10);
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --bar:rgba(249,249,249,.86);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --ink:#FFFFFF; --muted:#98989F; --line:rgba(84,84,88,.6);
    --accent:#0A84FF; --accent-ink:#FFFFFF; --soft:rgba(10,132,255,.18); --fill:rgba(120,120,128,.24);
    --good:#30D158; --good-soft:rgba(48,209,88,.16); --bad:#FF453A; --bad-soft:rgba(255,69,58,.16);
    --bar:rgba(22,22,24,.86); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --ink:#FFFFFF; --muted:#98989F; --line:rgba(84,84,88,.6);
  --accent:#0A84FF; --accent-ink:#FFFFFF; --soft:rgba(10,132,255,.18); --fill:rgba(120,120,128,.24);
  --good:#30D158; --good-soft:rgba(48,209,88,.16); --bad:#FF453A; --bad-soft:rgba(255,69,58,.16);
  --bar:rgba(22,22,24,.86); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;letter-spacing:-.01em;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
#app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:28px 20px 32px;display:flex;flex-direction:column;gap:16px}
nav{display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:6px 0 10px}
nav button{flex:1;background:none;border:0;padding:4px;font:500 11px var(--body);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1.1;letter-spacing:-.025em} h2{font-size:28px;line-height:1.15;letter-spacing:-.02em} h3{font-size:20px;line-height:1.2;letter-spacing:-.015em;font-weight:600}
p{margin:0}
.eyebrow{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.muted{color:var(--muted)} .small{font-size:14px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.chip{font:600 14px var(--body);padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}
.card{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px} .row>.card{flex:1;min-width:0;gap:4px}
.big{font:700 44px/1.05 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);width:0;transition:width .35s ease}
.week{display:flex;justify-content:space-between;gap:4px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.week b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--fill);font:600 14px var(--body);color:var(--muted)}
.week .on b{background:var(--accent);color:var(--accent-ink)}
.week .today b{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.btn{display:block;width:100%;padding:15px 18px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font:600 17px var(--body);letter-spacing:-.01em;cursor:pointer;text-align:center;transition:opacity .15s,transform .15s}
.btn:active{opacity:.7;transform:scale(.985)}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px} .btns .btn{padding:14px 6px;font-size:15px}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:16px;padding:14px 16px;color:var(--ink);font:inherit;cursor:pointer;transition:opacity .15s}
.item:active{opacity:.6}
.item::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg);opacity:.45}
.item .no{flex:none;min-width:36px;height:36px;padding:0 6px;border-radius:10px;display:grid;place-items:center;background:var(--fill);font:600 15px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.item .tx{flex:1;min-width:0} .item .tx b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.item .tx span{font-size:14px;color:var(--muted);line-height:1.3}
.item .st{flex:none;font:500 14px var(--body);color:var(--muted)}
.item.done .no{background:var(--soft);color:var(--accent)}
.back{align-self:flex-start;background:none;border:0;padding:2px 0;color:var(--accent);font:400 17px var(--body);cursor:pointer}
.q{font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.015em}
.q b{font-variant-numeric:tabular-nums}
.ansrow{display:flex;gap:10px;align-items:center}
input.num{flex:1;min-width:0;padding:13px 16px;border-radius:14px;border:0;background:var(--surface);color:var(--ink);font:600 24px var(--display);font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px var(--line)}
input.num:focus,textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.unit{font:600 18px var(--body);color:var(--muted);min-width:22px}
textarea{width:100%;min-height:150px;padding:14px 16px;border-radius:16px;border:0;background:var(--surface);color:var(--ink);font:400 17px/1.4 var(--body);resize:vertical;box-shadow:inset 0 0 0 1px var(--line)}
.fb{border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.45;background:var(--surface)}
.fb.ok{background:var(--good-soft)} .fb.ko{background:var(--bad-soft)}
.fb b.v{font-weight:700}
.fb.ok b.v{color:var(--good)} .fb.ko b.v{color:var(--bad)}
.clock{display:flex;align-items:center;gap:12px}
.clock span{font:600 22px var(--display);font-variant-numeric:tabular-nums;min-width:50px}
.clock span.small{font:400 14px var(--body);min-width:0}
.clock.over span:first-child{color:var(--bad)} .clock.over .bar i{background:var(--bad)} .clock .bar{flex:1}
.tablewrap{overflow-x:auto;border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:11px 12px;text-align:right;border-bottom:.5px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0;font-weight:600}
.model{border-radius:18px;background:var(--surface);padding:18px;font-size:15px;line-height:1.45}
.model ul,.model ol{margin:6px 0 0;padding-left:20px} .model li{margin:4px 0}
.model h3{font-size:16px;margin-top:14px} .model h3:first-child{margin-top:0}
.hyp{margin-top:14px;padding-top:14px;border-top:.5px solid var(--line);font-style:italic}
.btns.col{flex-direction:column} .btns.col .btn{text-align:left;padding:14px 16px;line-height:1.35;font-weight:500}
.chart{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font:500 11px var(--body);fill:var(--muted)} .chart text.v{fill:var(--ink);font-weight:600}
.sync{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px}
.sync i{width:8px;height:8px;border-radius:4px;background:var(--muted);flex:none}
.sync.ok i{background:var(--good)} .sync.err i{background:var(--bad)} .sync a{color:var(--accent)}
details{background:var(--surface);border-radius:16px;padding:0 18px}
summary{cursor:pointer;padding:16px 0;font:600 17px var(--body);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);opacity:.5;transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
summary::-webkit-details-marker{display:none}
details .body{padding:0 0 18px;font-size:15px;line-height:1.45;display:flex;flex-direction:column;gap:10px}
details .ex{background:var(--fill);border-radius:12px;padding:12px 14px;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.bar i,.btn,.item,summary::after{transition:none}}
</style>
</head>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
const fmt=n=>Number(n).toLocaleString("en-US",{maximumFractionDigits:1});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dkey=d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
const today=()=>dkey(new Date());
const addDays=(k,n)=>{const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return dkey(d)};
const mmss=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
function parseNum(v){
  v=String(v).replace(/[\s%€$]/g,"");
  if(/^-?\d{1,3}([.,]\d{3})+$/.test(v)) v=v.replace(/[.,]/g,"");
  else v=v.replace(",",".");
  return v===""?NaN:Number(v);
}

/* ---------- estado (se guarda en este dispositivo) ---------- */
const KEY="casos-v1";
const SUPABASE_URL="https://mwsapcjzubisdszmwswp.supabase.co";
const SUPABASE_KEY="sb_publishable_oe1TNOb-Y-Lu3jYI8wr5XA_nLDluFOf"; // clave pública: los datos los protege la base de datos
let S={days:{},stats:{},done:{},log:[],goal:3,plan:null,updatedAt:0};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
let sb=null,syncOn=false,pushT=null,syncMsg=["",'Solo en este navegador. <a href="../">Entra en Mi página</a> para guardarlo en tu cuenta.'];
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(syncOn){clearTimeout(pushT);pushT=setTimeout(push,700)}}
function setSync(state,txt){syncMsg=[state,txt];const el=document.getElementById("syncText");if(el){el.className="small muted sync "+state;el.querySelector("span").innerHTML=txt}}
async function push(){
  clearTimeout(pushT);pushT=null;
  const{error}=await sb.from("casos_progreso").upsert({id:"javi",data:S,updated_at:new Date().toISOString()});
  if(error)setSync("err","No se pudo guardar en la nube. Se reintentará en el próximo drill.");else setSync("ok","Progreso guardado en tu cuenta");
}
/* une lo de este navegador con lo de la nube sin perder nada de ninguno */
function merge(a,b){
  const o={days:{},stats:{},done:{},log:[],goal:a.goal||b.goal||3,plan:null,updatedAt:Math.max(a.updatedAt||0,b.updatedAt||0)};
  for(const s of [a,b]){
    for(const[k,v]of Object.entries(s.days||{}))o.days[k]=Math.max(o.days[k]||0,v);
    for(const[k,v]of Object.entries(s.stats||{}))if(!o.stats[k]||v.n>o.stats[k].n)o.stats[k]=v;
    for(const[k,v]of Object.entries(s.done||{}))o.done[k]=Math.max(o.done[k]||0,v);
  }
  const seen=new Set();o.log=(a.log||[]).concat(b.log||[]).filter(e=>!seen.has(e.t)&&seen.add(e.t)).sort((x,y)=>x.t-y.t).slice(-400);
  const pa=a.plan,pb=b.plan,ok=p=>p.items.filter(x=>x.ok).length;
  o.plan=!pa?pb||null:!pb?pa:pa.d!==pb.d?(pa.d>pb.d?pa:pb):(ok(pa)>=ok(pb)?pa:pb);
  return o;
}
async function initSync(){
  if(!window.supabase){setSync(...syncMsg);return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"mi-pagina-auth"}});
  const{data:{session}}=await sb.auth.getSession();
  if(!session){setSync(...syncMsg);return}
  const{data,error}=await sb.from("casos_progreso").select("data").eq("id","javi").maybeSingle();
  if(error){setSync("err","No se pudo leer tu progreso de la nube. Recarga para reintentar.");return}
  syncOn=true;
  if(data&&data.data&&Object.keys(data.data).length)S=merge(S,data.data);
  if(S.plan&&S.plan.d===today()&&!S.plan.items.some(x=>x.ok))S.plan=null; // el plan se rehace con lo ya hecho en la nube
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  await push();
  if(tab==="hoy"&&!tick)show("hoy");
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&syncOn&&pushT)push()});
function record(cat,score,id,x){
  const t=today();S.days[t]=(S.days[t]||0)+1;
  const st=S.stats[cat]||(S.stats[cat]={n:0,sum:0});st.n++;st.sum+=score;
  if(S.plan&&S.plan.d===t){const p=S.plan.items.find(x=>!x.ok&&x.c===cat&&(!x.id||x.id===id));if(p)p.ok=1}
  S.log.push(Object.assign({t:Date.now(),d:t,c:cat,s:Math.round(score*100)/100},id?{id}:{},x||{}));
  let k=0;for(let i=S.log.length-1;i>=0;i--)if(S.log[i].a&&++k>60)delete S.log[i].a;
  if(S.log.length>400)S.log=S.log.slice(-400);
  save();
}
/* nivel de los drills generados: sube con práctica y acierto */
function lvl(c){const s=S.stats[c];if(!s)return 1;const a=s.sum/s.n;return s.n>=25&&a>=.75?3:s.n>=10&&a>=.7?2:1}
function streak(){let d=today();if(!S.days[d])d=addDays(d,-1);let n=0;while(S.days[d]){n++;d=addDays(d,-1)}return n}
function weekKeys(){const t=new Date();const dow=(t.getDay()+6)%7;const mon=addDays(today(),-dow);return [0,1,2,3,4,5,6].map(i=>addDays(mon,i))}

/* ---------- categorías ---------- */
const CATS=[
 {id:"mental",n:"Cálculo mental",d:"Sprint de 60 s, sin calculadora",kind:"sprint"},
 {id:"quant",n:"Márgenes y P&L",d:"5 problemas con la solución paso a paso",kind:"set"},
 {id:"tabla",n:"Lectura de tablas",d:"P&L por segmentos y so what",kind:"table"},
 {id:"graf",n:"Gráficos",d:"El so what de un gráfico en 30 s",kind:"chart"},
 {id:"struct",n:"Estructuras",d:"Árbol MECE con hipótesis en 2 min",kind:"open",t:120},
 {id:"sizing",n:"Market sizing",d:"Estimación razonada en 3 min",kind:"open",t:180},
 {id:"synth",n:"Síntesis",d:"Recomendación top-down en 60 s",kind:"open",t:60},
 {id:"brain",n:"Brainstorming",d:"Ideas ordenadas en cubos, 2 min",kind:"open",t:120}
];
const CHK={
 struct:"Comprueba: 3 o 4 áreas que no se solapan · 2 o 3 puntos por área, propios de este cliente y no genéricos · dices por dónde empezarías y por qué.",
 sizing:"Comprueba: nombras el enfoque antes de calcular (de arriba abajo o de abajo arriba) · supuestos redondos y dichos en voz alta · comprobación de sentido al final.",
 synth:"Comprueba: respuesta en la primera frase · el número que la sostiene · un riesgo · el siguiente paso.",
 brain:"Comprueba: 2 a 4 cubos antes de la primera idea · ideas concretas, no categorías · dices cuál priorizarías."
};
const cat=id=>CATS.find(c=>c.id===id);

/* ---------- generadores: cálculo mental ---------- */
const MENTAL=[
 ()=>{const a=ri(5,40)*100,b=ri(11,Math.max(12,a/10-1))*10;return{q:`<b>${fmt(a)} − ${fmt(b)}</b>`,a:a-b,tol:0,unit:"",ex:`${fmt(a)} − ${fmt(b)} = ${fmt(a-b)}`}},
 ()=>{const p=pick([5,10,15,20,25,30,40,60,75]),n=ri(2,40)*20;return{q:`<b>${p}% of ${fmt(n)}</b>`,a:p*n/100,tol:0,unit:"",ex:`${p}% de ${fmt(n)} = ${fmt(p*n/100)}`}},
 ()=>{const b=pick([200,250,300,400,500,600,800,1200,1500]),a=Math.round(b*ri(5,90)/1000)*10;return{q:`<b>${fmt(a)} / ${fmt(b)}</b> as a percentage`,a:a/b*100,tol:1.5,unit:"%",ex:`${fmt(a)} / ${fmt(b)} = ${fmt(a/b*100)}%`}},
 ()=>{const a=ri(2,9)*10+ri(0,1)*5,b=ri(3,12)*10;return{q:`<b>${a} × ${b}</b>`,a:a*b,tol:0,unit:"",ex:`${a} × ${b} = ${fmt(a*b)}`}},
 ()=>{const a=ri(2,20)*100,p=pick([-40,-30,-25,-20,-15,-10,-5,5,10,15,20,25,30,40,50,60]),b=a*(1+p/100);return{q:`From <b>${fmt(a)}</b> to <b>${fmt(b)}</b>: % change`,a:p,tol:1,unit:"%",ex:`(${fmt(b)} − ${fmt(a)}) / ${fmt(a)} = ${p}%`}}
];

/* ---------- generadores: márgenes y P&L ---------- */
const QUANT=[
 ()=>{const R=ri(3,15)*100,m=ri(8,45),P=Math.round(R*m/1000)*10,C=R-P;
  return{q:`Revenue is <b>€${fmt(R)}k</b> and total costs are <b>€${fmt(C)}k</b>. What is the operating margin?`,a:P/R*100,tol:1,unit:"%",
  ex:`Beneficio = ${fmt(R)} − ${fmt(C)} = ${fmt(P)}. Margen = ${fmt(P)} / ${fmt(R)} = <b>${fmt(P/R*100)}%</b>. Comprueba: ¿más o menos que la mitad? ${P/R<.5?"Menos":"Más"}, cuadra.`}},
 ()=>{const p=ri(4,20),v=ri(1,p-1),cm=p-v,u=ri(2,30)*100,F=cm*u;
  return{q:`Price per unit <b>€${p}</b>, variable cost per unit <b>€${v}</b>, fixed costs <b>€${fmt(F)}</b>. How many units to break even?`,a:u,tol:0,unit:"u",
  ex:`Margen de contribución = ${p} − ${v} = €${cm} por unidad. Breakeven = fijos / contribución = ${fmt(F)} / ${cm} = <b>${fmt(u)} unidades</b>.`}},

      return{pre:html,qs:[

        {q:`What is the operating margin of <b>${cu.n}</b> in Year 2?`,a:cu.m2,tol:1,unit:"%",
         ex:`${fmt(cu.P2)} / ${fmt(cu.R2)} = <b>${cu.m2}%</b> (en el año 1 era ${cu.m1}%). Margen = beneficio / ingresos, nunca ingresos − beneficio.`}
      ],after:`<div class="model"><h3>So what, en una frase</h3><p>"Profit fell by ${fmt(T.P1-T.P2)}, and ${cu.n} explains most of it: its margin dropped from ${cu.m1}% to ${cu.m2}% ${cu.R2===cu.R1?"on flat revenue":"while revenue went from "+fmt(cu.R1)+" to "+fmt(cu.R2)}. I'd look next at price and cost per unit in ${cu.n}."</p></div>`};
    }

 ["La cascada del P&L",`<p>Ingresos − costes variables (COGS) = <b>margen bruto</b>. Menos gastos operativos (opex) = <b>EBITDA</b>. Menos amortización = <b>EBIT</b> (operating profit). Menos intereses e impuestos = <b>beneficio neto</b>.</p><div class="ex">Puesto de churros: vende 300, harina y aceite 120 → margen bruto 180. Alquiler y sueldo 100 → beneficio 80.</div><p>Beneficio nunca es ingresos, y costes nunca es beneficio. Si restas ingresos − beneficio, lo que obtienes son los costes.</p>`],
 ["Márgenes",`<p>Margen = beneficio / ingresos, en %. Gross margin usa el margen bruto; operating margin usa el beneficio operativo.</p><div class="ex">80 / 300 = 27%. Comprobación rápida: el 10% de 300 es 30; 80 son algo menos de tres veces 30, luego algo menos del 30%.</div><p>Antes de decir el número, pregúntate si es más o menos que la mitad.</p>`],

  main.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const p=pl.items[+b.dataset.p],it=p.id&&OPEN[p.c].find(x=>x.id===p.id);it?runOpen(cat(p.c),it):startCat(p.c)});
  $("#copy").onclick=()=>{
    const lines=CATS.filter(c=>S.stats[c.id]).map(c=>`- ${c.n}: ${S.stats[c.id].n} drills, ${Math.round(S.stats[c.id].sum/S.stats[c.id].n*100)}% de acierto (acumulado)`);
    const txt=`Drills esta semana: ${wkN}. Racha: ${st} días.\n${lines.join("\n")||"- Sin drills todavía"}${w?`\nPunto débil: ${w.c.n}`:""}`;
    const msg=$("#copymsg");
    try{navigator.clipboard.writeText(txt).then(()=>msg.textContent="Resumen copiado. Pégalo en el chat.",()=>msg.textContent=txt)}catch(e){msg.textContent=txt}
  };
}
function vDrills(){
  main.innerHTML=`<div><p class="eyebrow">8 categorías</p><h1>Drills</h1></div>`+CATS.map((c,i)=>{
    const s=S.stats[c.id];
    return `<button class="item ${s?"done":""}" data-c="${c.id}"><span class="no">${String(i+1).padStart(2,"0")}</span><span class="tx"><b>${c.n}</b><span>${c.d}</span></span><span class="st">${s?Math.round(s.sum/s.n*100)+"%":""}</span></button>`}).join("");
  main.querySelectorAll(".item").forEach(b=>b.onclick=()=>startCat(b.dataset.c));
}
function vTeoria(){
  main.innerHTML=`<div><p class="eyebrow">Lo mínimo, con el puesto de churros</p><h1>Teoría</h1></div>`+TEORIA.map(t=>`<details><summary>${t[0]}</summary><div class="body">${t[1]}</div></details>`).join("");
}

/* ---------- arranque de categorías ---------- */
function startCat(id){
  stop();setTab("drills");const c=cat(id);
  if(c.kind==="sprint")return runSprint(c);
  if(c.kind==="set"){const P=pool("quant");return runSet(c,{qs:Array.from({length:5},()=>pick(P)())})}
  if(c.kind==="chart")return runSet(c,genChart());
  if(c.kind==="table")return runSet(c,lvl("tabla")>1&&Math.random()<.5?genTableMix():genTable());
  vList(c);
}
function vList(c){
  stop();const sc=["","Flojo","Regular","Bien"];
  const nx=nextOf(c.id),LV=["","Nivel 1 · base","Nivel 2 · intermedio","Nivel 3 · final round"];
  main.innerHTML=`<button class="back" id="bk">← Drills</button><div><p class="eyebrow">Objetivo ${mmss(c.t)} por drill · ${OPEN[c.id].length-leftOf(c.id)} de ${OPEN[c.id].length} hechos</p><h1>${c.n}</h1></div>${nx?`<button class="btn" id="nxt">Siguiente sin hacer</button>`:""}`+OPEN[c.id].map((it,i)=>{
    const d=S.done[it.id],hd=i===0||OPEN[c.id][i-1].l!==it.l?`<h3 style="margin-top:12px">${LV[it.l]}</h3>`:"";
    return hd+`<button class="item ${d?"done":""}" data-i="${i}"><span class="no">${i+1}</span><span class="tx"><b>${it.q.length>70?it.q.slice(0,68)+"…":it.q}</b><span>${it.tag}</span></span><span class="st">${d?sc[d]:""}</span></button>`}).join("");
  $("#bk").onclick=()=>show("drills");if(nx)$("#nxt").onclick=()=>runOpen(c,nx);
  main.querySelectorAll(".item").forEach(b=>b.onclick=()=>runOpen(c,OPEN[c.id][+b.dataset.i]));
  main.scrollTop=0;
}

/* ---------- sprint de 60 s ---------- */
function runSprint(c){
  const R={ok:0,n:0,miss:[],end:Date.now()+60000,cur:null};
  main.innerHTML=`<button class="back" id="bk">← Salir</button>
  <div class="clock"><span id="ck">1:00</span><div class="bar"><i id="cb" style="width:100%"></i></div></div>
  <p class="eyebrow">${c.n} · nivel ${lvl(c.id)} · aciertos <b id="okn">0</b></p>
  <p class="q" id="qt"></p>
  <form id="f" class="ansrow"><input class="num" id="ans" inputmode="decimal" autocomplete="off" aria-label="Tu respuesta"><span class="unit" id="un"></span><button class="btn" style="width:auto" type="submit">OK</button></form>
  <div class="fb" id="fb">Responde y pulsa OK. Los porcentajes valen con ±1 punto.</div>`;
  const P=pool("mental");const next=()=>{R.cur=pick(P)();$("#qt").innerHTML=R.cur.q;$("#un").textContent=R.cur.unit;$("#ans").value=""};
  next();$("#ans").focus();
  $("#bk").onclick=()=>show("drills");
  $("#f").onsubmit=e=>{
    e.preventDefault();const v=parseNum($("#ans").value);if(isNaN(v))return;
    const good=Math.abs(v-R.cur.a)<=R.cur.tol+1e-9;R.n++;if(good)R.ok++;else R.miss.push(R.cur.ex);
    const fb=$("#fb");fb.className="fb "+(good?"ok":"ko");fb.innerHTML=`<b class="v">${good?"Bien":"No"}</b> · ${R.cur.ex}`;
    $("#okn").textContent=R.ok;next();$("#ans").focus();
  };
  tick=setInterval(()=>{
    const left=Math.max(0,R.end-Date.now());$("#ck").textContent=mmss(Math.ceil(left/1000));$("#cb").style.width=(left/600)+"%";
    if(left<=0){stop();const sc=R.n?R.ok/R.n:0;record(c.id,sc,null,{n:R.n,ok:R.ok,miss:R.miss.slice(0,6)});
      result(c,`<span class="big">${R.ok} de ${R.n}</span><p class="muted">aciertos en 60 segundos${R.n<8?". Objetivo: 10 o más intentos":""}</p>`+(R.miss.length?`<div class="model"><h3>Fallos</h3><ul>${R.miss.map(m=>`<li>${m}</li>`).join("")}</ul></div>`:""),()=>startCat(c.id));}
  },200);
}

/* ---------- series con corrección ---------- */
function runSet(c,set){
  let i=0,ok=0,sec=0;const miss=[],strip=h=>h.replace(/<[^>]+>/g,"");
  const draw=()=>{
    const q=set.qs[i];
    main.innerHTML=`<button class="back" id="bk">← Salir</button>
    <p class="eyebrow">${c.n} · nivel ${lvl(c.id)} · ${i+1} de ${set.qs.length}</p>${set.t&&i===0?`<div class="clock" id="cl"><span id="ck">0:00</span><div class="bar"><i id="cb"></i></div><span class="small muted">de ${mmss(set.t)}</span></div>`:""}${set.pre||""}
    <p class="q">${q.q}</p>
    ${q.opts?`<div class="btns${q.col?" col":""}" id="opts">${q.opts.map(o=>`<button class="btn ghost" data-o="${esc(o)}">${o}</button>`).join("")}</div>`
     :`<form id="f" class="ansrow"><input class="num" id="ans" inputmode="decimal" autocomplete="off" aria-label="Tu respuesta"><span class="unit">${q.unit}</span><button class="btn" style="width:auto" type="submit">Comprobar</button></form>`}
    <div id="out"></div>`;
    main.scrollTop=0;$("#bk").onclick=()=>show("drills");
    const t0=Date.now();
    if(set.t&&i===0){stop();tick=setInterval(()=>{const x=(Date.now()-t0)/1000;$("#ck").textContent=mmss(x);$("#cb").style.width=Math.min(100,x/set.t*100)+"%";$("#cl").classList.toggle("over",x>set.t)},250)}
    const answer=(good,given)=>{
      if(set.t&&i===0){stop();sec=Math.round((Date.now()-t0)/1000)}
      if(good)ok++;else miss.push(strip(q.q)+" → "+given);
      main.querySelectorAll("#opts button,#f button,#ans").forEach(el=>el.disabled=true);
      const last=i===set.qs.length-1;
      $("#out").innerHTML=`<div class="fb ${good?"ok":"ko"}"><b class="v">${good?"Bien":"No"}</b> · ${q.ex}</div>${last&&set.after?set.after:""}<button class="btn" id="nx" style="margin-top:14px">${last?"Ver resultado":"Siguiente"}</button>`;
      $("#nx").onclick=()=>{if(last){record(c.id,ok/set.qs.length,null,Object.assign({miss:miss.slice(0,6)},set.t?{sec}:{}));result(c,`<span class="big">${ok} de ${set.qs.length}</span><p class="muted">respuestas correctas</p>`,()=>startCat(c.id))}else{i++;draw()}};
      $("#nx").scrollIntoView({block:"nearest"});
    };
    if(q.opts)main.querySelectorAll("#opts button").forEach(b=>b.onclick=()=>answer(b.dataset.o===q.a,b.dataset.o));
    else{$("#f").onsubmit=e=>{e.preventDefault();const v=parseNum($("#ans").value);if(isNaN(v))return;answer(Math.abs(v-q.a)<=q.tol+1e-9,v)};try{$("#ans").focus()}catch(e){}}
  };
  draw();
}

/* ---------- drills abiertos ---------- */
function runOpen(c,it){
  stop();setTab("drills");const t0=Date.now();let used=0;
  main.innerHTML=`<button class="back" id="bk">← ${c.n}</button>
  <p class="eyebrow">${c.n} · ${it.tag}</p>
  <p class="q">${it.q}</p>
  <div class="clock" id="cl"><span id="ck">0:00</span><div class="bar"><i id="cb"></i></div><span class="small muted">de ${mmss(c.t)}</span></div>
  <textarea id="resp" placeholder="Responde en inglés. Si lo dices en voz alta, apunta aquí solo los titulares."></textarea>
  <button class="btn" id="rv">Ver respuesta modelo</button>
  <div id="after" hidden style="display:none;flex-direction:column;gap:14px">
    <div class="model">${it.m}</div>
    <p class="small muted">${CHK[c.id]}</p>
    <p class="eyebrow">¿Cómo te ha salido? Sé duro</p>
    <div class="btns"><button class="btn ghost" data-r="1">Flojo</button><button class="btn ghost" data-r="2">Regular</button><button class="btn ghost" data-r="3">Bien</button></div>
  </div>`;
  main.scrollTop=0;$("#bk").onclick=()=>vList(c);
  tick=setInterval(()=>{const s=(Date.now()-t0)/1000;$("#ck").textContent=mmss(s);$("#cb").style.width=Math.min(100,s/c.t*100)+"%";$("#cl").classList.toggle("over",s>c.t)},250);
  $("#rv").onclick=()=>{used=Math.round((Date.now()-t0)/1000);stop();$("#rv").hidden=true;$("#resp").readOnly=true;const a=$("#after");a.hidden=false;a.style.display="flex";a.scrollIntoView({block:"start"})};
  main.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const r=+b.dataset.r;S.done[it.id]=Math.max(S.done[it.id]||0,r);record(c.id,r/3,it.id,{sec:used,a:$("#resp").value.trim().slice(0,1200)});
    const nx=nextOf(c.id)||OPEN[c.id][0];
    result(c,`<h2>${["","Flojo","Regular","Bien"][r]}</h2><p class="muted">Tiempo: ${mmss(used)} de ${mmss(c.t)}${used>c.t?". Te has pasado: la próxima, más corto":""}</p>`,()=>runOpen(c,nx),"Siguiente drill");
  });
}

function result(c,html,again,label){
  stop();const done=S.days[today()]||0;
  main.innerHTML=`<p class="eyebrow">${c.n} · guardado</p><div class="card">${html}</div>
  <div class="card"><div class="head"><p class="eyebrow">Objetivo de hoy</p><b>${Math.min(done,S.goal)} de ${S.goal}</b></div><div class="bar"><i style="width:${Math.min(100,done/S.goal*100)}%"></i></div></div>
  <button class="btn" id="ag">${label||"Otra vez"}</button><button class="btn ghost" id="hm">Volver a Hoy</button>`;
  main.scrollTop=0;$("#ag").onclick=again;$("#hm").onclick=()=>{try{location.hash="hoy"}catch(e){}show("hoy")};
}

show(["hoy","drills","teoria"].includes(location.hash.slice(1))?location.hash.slice(1):"hoy");
initSync();
</script>
