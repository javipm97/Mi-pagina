<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Boda Javier y Laura</title>
<style>
/* Layout: barra superior, fila de cifras clave, pestañas y tablas con la primera columna fija (scroll horizontal en móvil) */
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --sunk:#F2F2EE; --ink:#1C1C1A; --muted:#7A7A73; --line:#E6E6E0; --line2:#D4D4CC;
  --accent:#3F5E46;
  --ok:#2E7D4F; --ok-bg:#E6F3EA; --warn:#9A6A00; --warn-bg:#FBF1D9; --bad:#B23A3A; --bad-bg:#FBE6E6;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141413; --surface:#1C1C1A; --sunk:#252522; --ink:#EDEDE8; --muted:#9A9A92; --line:#2E2E2B; --line2:#3D3D39;
  --accent:#8FB896; --ok:#7FCB97; --ok-bg:#1D2E22; --warn:#E2BC5E; --warn-bg:#33291A; --bad:#EE8F8F; --bad-bg:#3A2020; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-left,0px)) 48px max(14px,env(safe-area-inset-right,0px))}
h1{font-size:18px;font-weight:650;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;min-width:0}
textarea{width:100%;resize:vertical;min-height:54px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:5px 12px}
.btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.btn-link{border:none;background:none;color:var(--muted);padding:4px 0;text-decoration:underline;font-size:12px}
[hidden]{display:none!important}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.stamp{font-size:12px;color:var(--muted)}

/* cifras clave */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:12px;overflow:hidden}
.kpi{padding:10px 12px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:none}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(3){border-right:none}.kpi:nth-child(-n+3){border-bottom:1px solid var(--line)}}

/* pestañas y controles */
nav.tabs{display:flex;gap:2px;margin-top:16px;border-bottom:1px solid var(--line)}
nav.tabs button{border:none;border-radius:0;background:none;padding:9px 12px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
nav.tabs .c{font-weight:500;margin-left:4px;font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:none;border-radius:0;padding:5px 10px;border-right:1px solid var(--line2);font-variant-numeric:tabular-nums}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.lbl{font-size:12px;color:var(--muted);margin-right:-2px}
.spacer{flex:1}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:-4px 0 10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}

/* tabla */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
th.grp{text-align:center;border-left:1px solid var(--line)}
td.l,th.l{text-align:left}
td.c,th.c{text-align:center}
.bl{border-left:1px solid var(--line)}
tr:last-child>td{border-bottom:none}
.fx{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;max-width:190px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
th.fx{background:var(--sunk);z-index:2}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--sunk)}
tbody tr.row.open td{background:var(--sunk)}
tr.desc td{opacity:.45}
.fn{font-weight:600}
.est{display:block;font-size:11px;color:var(--muted);font-weight:500}
.t-ok{background:var(--ok-bg)!important;color:var(--ok);font-weight:600}
.t-warn{background:var(--warn-bg)!important;color:var(--warn);font-weight:600}
.t-bad{background:var(--bad-bg)!important;color:var(--bad);font-weight:600}
.aprox{font-style:italic;opacity:.8}
.nd{color:var(--muted);opacity:.6}
.ref{color:var(--muted);text-align:center;font-size:12.5px}
.y{color:var(--ok);font-weight:700}
.n{color:var(--bad);font-weight:700}
.q{color:var(--muted)}
.st{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);font-weight:600}
.st.fav{background:var(--ink);color:var(--bg)}
.st.resp{background:var(--ok-bg);color:var(--ok)}
.st.vis{background:var(--warn-bg);color:var(--warn)}

/* detalle de finca */
tr.det>td{background:var(--bg);white-space:normal;text-align:left;padding:12px}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cell{background:var(--surface);padding:7px 10px;min-width:0}
.cell .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.cell .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.det-grid{display:grid;gap:12px;max-width:1000px}
.mx{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);display:inline-block;max-width:100%;overflow-x:auto}
.mx table th,.mx table td{padding:6px 12px}
.links{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.links a{color:var(--accent);font-weight:600}
.edrow{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.edrow label{display:grid;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
details.notes summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600}
details.notes dl{margin:8px 0 0;display:grid;gap:8px;font-size:13px;max-width:900px}
details.notes dt{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
details.notes dd{margin:0;white-space:pre-wrap}

/* decisiones y tareas */
td.wrap,th.wrap{white-space:normal;text-align:left;min-width:160px}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
td input[type=text],td textarea,td select{width:100%}
td input[type=checkbox]{width:17px;height:17px;accent-color:var(--ink)}
tr.done td{color:var(--muted)}
tr.done .tt{text-decoration:line-through}
.late{color:var(--bad);font-weight:600}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.addbar input,.addbar select{flex:1 1 140px}

.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:12px}
.login input{width:100%;font-size:16px;padding:9px 11px}
.status{font-size:12px;color:var(--muted);min-height:1.2em;margin-top:8px}
.status.err{color:var(--bad)} .status.okk{color:var(--ok)}
.editbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px}
.editbar .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:4px}
@media (max-width:600px){th,td{padding:7px 7px}.fx{max-width:122px;font-size:13px}.kpi .v{font-size:17px}}
.foot{margin-top:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Boda Javier y Laura · 2028</h1><span class="stamp" id="stamp"></span></div>

  <section id="login" class="login" hidden>
    <strong>Entrar</strong>
    <form id="loginForm" style="display:grid;gap:10px">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Clave" aria-label="Clave" required>
      <button class="btn-primary" type="submit">Entrar</button>
    </form>
    <div class="status err" id="loginErr" role="alert"></div>
  </section>

  <div id="app" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="editbar" id="editbar" hidden>
      <span class="tag">Edición</span><span class="muted">Votas como</span>
      <span class="seg"><button type="button" data-yo="javier" aria-pressed="false">Javier</button><button type="button" data-yo="laura" aria-pressed="false">Laura</button></span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="fincas" aria-selected="true">Fincas<span class="c" id="c-fincas"></span></button>
      <button role="tab" data-tab="decisiones" aria-selected="false">Decisiones<span class="c" id="c-decisiones"></span></button>
      <button role="tab" data-tab="tareas" aria-selected="false">Tareas<span class="c" id="c-tareas"></span></button>
    </nav>
    <main id="view"></main>
    <div class="foot"><span id="footTxt">Solo consulta. Los cambios los hacen Javier y Laura.</span><button type="button" class="btn-link" id="logout">Salir</button></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const SUPABASE_URL="https://mwsapcjzubisdszmwswp.supabase.co";
  const SUPABASE_KEY="sb_publishable_oe1TNOb-Y-Lu3jYI8wr5XA_nLDluFOf";
  const MESES=[["mar","Mar"],["may","May"],["jun","Jun"],["sep","Sep"],["oct","Oct"]];
  const INV=[120,130,140];
  const ESTADOS=["Por contactar","Correo listo","Correo enviado","Han respondido","Visita prevista","Visitada","Favorita","Descartada"];
  const S={fincas:[],decisiones:[],tareas:[],config:{},updated:null,rol:"lector",pw:""};
  const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}};
  const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
  const YO={w:ls("boda-yo","")};
  const UI={tab:ls("boda-tab","fincas"),vista:ls("boda-vista","mes"),inv:Number(ls("boda-inv","130")),mes:ls("boda-mes","mar"),orden:ls("boda-orden","precio"),ocultar:ls("boda-ocultar","1")==="1",abierta:""};
  if(!INV.includes(UI.inv)) UI.inv=130;

  const $=s=>document.querySelector(s);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
  const eur=v=>v==null?"":Math.round(v).toLocaleString("es-ES")+" €";
  const k=v=>v==null?"":(Math.round(v/100)/10).toLocaleString("es-ES",{minimumFractionDigits:1,maximumFractionDigits:1})+" k";
  const getPw=()=>ls("boda-clave","");
  const setPw=v=>{ try{ v?localStorage.setItem("boda-clave",v):localStorage.removeItem("boda-clave"); }catch(e){} };

  // ---------- datos ----------
  async function rpc(fn,body){
    let r;
    try{ r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)}); }
    catch(e){ throw new Error("red"); }
    const j=await r.json().catch(()=>null);
    if(!r.ok){ const m=(j&&j.message)||""; throw new Error(m.includes("clave_incorrecta")?"clave":m.includes("demasiados_intentos")?"intentos":"servidor"); }
    return j;
  }
  const editor=()=>S.rol==="editor";
  function setStatus(msg,err){ const el=$("#saveStatus"); if(el){ el.textContent=msg; el.className="status "+(err?"err":"okk"); } }
  async function guardar(col,id,patch){
    const o=S[col].find(x=>x.id===id); if(!o) return;
    Object.assign(o,patch);
    try{ await rpc("boda_guardar",{p_password:S.pw,p_coleccion:col,p_id:id,p_data:patch}); setStatus("Guardado"); }
    catch(e){ setStatus(e.message==="intentos"?"Demasiados intentos, espera 10 minutos.":"No se ha podido guardar. Recarga e inténtalo otra vez.",true); }
  }
  function aplicar(rows){
    S.fincas=[];S.decisiones=[];S.tareas=[];S.config={};S.updated=null;
    for(const r of rows){
      const o={id:r.id,...r.d};
      if(r.c==="fincas")S.fincas.push(o); else if(r.c==="decisiones")S.decisiones.push(o); else if(r.c==="tareas")S.tareas.push(o);
      else if(r.c==="config"&&r.id==="general")S.config=o;
      if(r.u&&(!S.updated||r.u>S.updated))S.updated=r.u;
    }
  }
  function mostrarLogin(msg){ $("#app").hidden=true; $("#login").hidden=false; $("#loginErr").textContent=msg||""; $("#stamp").textContent=""; }
  function mostrarApp(){
    $("#login").hidden=true; $("#app").hidden=false;
    if(S.updated){ $("#stamp").textContent="Actualizado "+new Date(S.updated).toLocaleDateString("es-ES",{day:"numeric",month:"short"}); }
    render();
  }
  async function entrar(pw,esAuto){
    try{ const rows=await rpc("boda_leer",{p_password:pw}); S.rol=await rpc("boda_rol",{p_password:pw}); S.pw=pw; aplicar(rows); setPw(pw); mostrarApp(); }
    catch(e){
      if(e.message==="clave"){ setPw(""); mostrarLogin(esAuto?"":"La clave no es correcta."); }
      else if(e.message==="intentos") mostrarLogin("Demasiados intentos. Espera 10 minutos.");
      else if(e.message==="red") mostrarLogin("Sin conexión. Revisa internet y recarga.");
      else mostrarLogin("No se pueden cargar los datos ahora. Prueba en un rato.");
    }
  }
  $("#loginForm").addEventListener("submit",e=>{ e.preventDefault(); const v=$("#pw").value.trim(); if(v) entrar(v,false); });
  $("#logout").addEventListener("click",()=>{ setPw(""); $("#pw").value=""; mostrarLogin(""); });

  // ---------- cálculo ----------
  // total sábado con IVA: menú (10 %) por invitado, plazas hasta el mínimo, fijo (alquiler, DJ...) al 21 % salvo ivaF
  function total(f,mes,n){
    const d=f.n&&f.n.m&&f.n.m[mes]; if(!d) return null;
    if(d.tot!=null) return n<=(d.min||0)?{v:d.tot,c:d.c}:null;
    const mn=d.min||0, eff=Math.max(n,mn), falta=eff-n;
    const pp=n*d.pp+falta*(d.fa!=null?d.fa:d.pp);
    const fx=(d.f||0)+(d.fc&&n<d.fc[0]?d.fc[1]:0);
    const ivaF=1+((f.n.ivaF!=null?f.n.ivaF:21)/100);
    return {v:pp*1.10+fx*ivaF,c:d.c};
  }
  const minMes=(f,mes)=>{ const d=f.n&&f.n.m&&f.n.m[mes]; return d?d.min:undefined; };
  const presupuestoFinca=()=>Number(S.config.presupuesto)||35000;
  function tone(v){ if(v==null) return ""; return v<=24000?"t-ok":v<=30000?"t-warn":"t-bad"; }
  function cellTot(t){
    if(!t) return `<td class="nd">—</td>`;
    return `<td class="${tone(t.v)} ${t.c?"":"aprox"}" title="${t.c?"Del dosier":"Estimado: confirmar"}">${t.c?"":"≈"}${k(t.v)}</td>`;
  }
  const yn=v=>v===1||v===true||v==="si"?'<span class="y">✓</span>':v===0||v===false?'<span class="n">✗</span>':'<span class="q">?</span>';
  const gil=v=>v==="si"?'<span class="y">✓</span>':typeof v==="number"?`+${String(v).replace(".",",")} €`:'<span class="q">?</span>';
  const voto=(f,w)=>{ const v=Number((f.votos||{})[w])||0; return v?String(v):'<span class="nd">–</span>'; };
  const score=f=>{ const v=f.votos||{}; return (Number(v.javier)||0)+(Number(v.laura)||0); };
  function rangoMin(f){
    const m=f.n&&f.n.m; const xs=m?Object.values(m).map(d=>d.min).filter(x=>x!=null):[];
    if(xs.length){ const a=Math.min(...xs),b=Math.max(...xs); return a===b?String(a):a+"–"+b; }
    return f.n&&f.n.minS!=null?String(f.n.minS):'<span class="q">?</span>';
  }
  function estadoPill(e){ const c=e==="Favorita"?"fav":e==="Han respondido"?"resp":(e==="Visita prevista"||e==="Visitada")?"vis":""; return `<span class="st ${c}">${esc(e||"")}</span>`; }

  // ---------- vistas ----------
  function renderKpis(){
    const act=S.fincas.filter(f=>f.estado!=="Descartada");
    const conPrecio=act.filter(f=>f.n&&f.n.m).length;
    const resp=act.filter(f=>["Han respondido","Visita prevista","Visitada","Favorita"].includes(f.estado)).length;
    const visitas=act.filter(f=>f.estado==="Visita prevista").length;
    const fecha=(S.decisiones.find(d=>d.id==="fecha")||{}).decision||"Pendiente";
    const pend=S.tareas.filter(t=>!t.hecho).length;
    const K=[["Presupuesto",eur(presupuestoFinca())],["Fecha",fecha],["Invitados","120–140"],["Fincas activas",act.length],["Responden · con precio",resp+" · "+conPrecio],["Visitas dic.",visitas]];
    $("#kpis").innerHTML=K.map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v" title="${esc(v)}">${esc(v)}</div></div>`).join("");
    $("#c-fincas").textContent=act.length;
    $("#c-decisiones").textContent=S.decisiones.filter(d=>!d.decision).length;
    $("#c-tareas").textContent=pend;
    document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===UI.tab)));
  }
  function claveOrden(f){
    if(UI.orden==="votos") return -score(f);
    const t=UI.vista==="mes"?total(f,"mar",UI.inv)||MESES.map(([m])=>total(f,m,UI.inv)).find(Boolean):total(f,UI.mes,UI.inv);
    return t?t.v:1e9;
  }
  function viewFincas(){
    let list=S.fincas.slice();
    if(UI.ocultar) list=list.filter(f=>f.estado!=="Descartada");
    list.sort((a,b)=>claveOrden(a)-claveOrden(b)||(a.orden||99)-(b.orden||99));
    const seg=(arr,cur,act)=>`<span class="seg">${arr.map(([v,l])=>`<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${String(v)===String(cur)}">${l}</button>`).join("")}</span>`;
    const bar=`<div class="bar">
      ${seg([["mes","Por mes"],["inv","Por invitados"]],UI.vista,"vista")}
      ${UI.vista==="mes"?`<span class="lbl">Invitados</span>${seg(INV.map(n=>[n,n]),UI.inv,"inv")}`:`<span class="lbl">Mes</span>${seg(MESES,UI.mes,"mes")}`}
      <span class="spacer"></span>
      <span class="lbl">Orden</span>${seg([["precio","€"],["votos","Votos"]],UI.orden,"orden")}
      <label class="lbl"><input type="checkbox" data-act="ocultar" ${UI.ocultar?"checked":""}> Ocultar descartadas</label>
    </div>
    <div class="legend"><span>Sábado · finca + menú + barra + DJ · IVA incl. · miles de €</span>
      <span><i class="sw" style="background:var(--ok-bg);border:1px solid var(--ok)"></i>≤ 24 k</span>
      <span><i class="sw" style="background:var(--warn-bg);border:1px solid var(--warn)"></i>24–30 k</span>
      <span><i class="sw" style="background:var(--bad-bg);border:1px solid var(--bad)"></i>&gt; 30 k</span>
      <span><i>≈</i> estimado</span></div>`;
    const cols=UI.vista==="mes"?MESES.map(([,l])=>l):INV.map(String);
    const head=`<tr><th class="fx l">Finca</th>${cols.map((c,i)=>`<th class="${i===0?"bl":""}">${c}</th>`).join("")}
      ${UI.vista==="inv"?`<th>€/inv</th>`:""}
      <th class="bl">Mín. inv.</th><th>Coche</th><th class="c">Barra</th><th class="c">DJ</th><th>Gildas</th><th class="c">Excl.</th><th>Reseñas</th>
      <th class="bl c">J</th><th class="c">L</th><th class="l">Estado</th></tr>`;
    const NC=cols.length+(UI.vista==="inv"?1:0)+11;
    const rows=list.map(f=>{
      const n=f.n||{};
      let celdas;
      if(n.m){
        celdas=UI.vista==="mes"?MESES.map(([m])=>cellTot(total(f,m,UI.inv))).join(""):INV.map(x=>cellTot(total(f,UI.mes,x))).join("");
        if(UI.vista==="inv"){ const t=total(f,UI.mes,130); celdas+=`<td>${t?Math.round(t.v/130)+" €":'<span class="nd">—</span>'}</td>`; }
        celdas=celdas.replace("<td class=\"",'<td class="bl ');
      } else {
        const span=cols.length+(UI.vista==="inv"?1:0);
        celdas=`<td class="ref bl" colspan="${span}">${n.ref?"Bodas.net "+esc(n.ref)+" €/inv":"Sin precio"}</td>`;
      }
      const rsn=n.res?(n.nota?String(n.nota).replace(".",",")+" · ":"")+n.res:'<span class="nd">–</span>';
      const open=UI.abierta===f.id;
      return `<tr class="row ${f.estado==="Descartada"?"desc":""} ${open?"open":""}" data-act="abrir" data-id="${esc(f.id)}">
        <td class="fx"><span class="fn">${esc(f.nombre)}</span></td>${celdas}
        <td class="bl">${UI.vista==="inv"&&n.m?(minMes(f,UI.mes)??'<span class="q">?</span>'):rangoMin(f)}</td>
        <td>${n.t!=null?n.t+"′":""}</td><td class="c">${yn(n.barra)}</td><td class="c">${yn(n.dj)}</td><td>${gil(n.gil)}</td><td class="c">${yn(n.ex)}</td><td>${rsn}</td>
        <td class="bl c">${voto(f,"javier")}</td><td class="c">${voto(f,"laura")}</td><td class="l">${estadoPill(f.estado)}</td></tr>
        ${open?`<tr class="det"><td colspan="${NC}">${detalle(f)}</td></tr>`:""}`;
    }).join("");
    return bar+`<div class="tw"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
  }
  function detalle(f){
    const n=f.n||{};
    const C=[["Tarifa",n.y||"?"],["Reserva",n.resv!=null?eur(n.resv):"?"],["¿Se devuelve?",n.reemb===0?"No":n.reemb===1?"Sí":"?"],["Pago final",n.pago!=null?(n.pago?n.pago+" días antes":"El día"):"?"],
      ["Mín. sábado",n.m?rangoMin(f).replace(/<[^>]+>/g,""):(n.minS!=null?n.minS:"?")],["Coche",n.t!=null?n.t+" min":"?"],["Votos J · L",(Number((f.votos||{}).javier)||"–")+" · "+(Number((f.votos||{}).laura)||"–")],["Visita",f.visita?new Date(f.visita+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"}):"–"]];
    const cells=`<div class="cells">${C.map(([l,v])=>`<div class="cell"><div class="l">${l}</div><div class="v">${esc(v)}</div></div>`).join("")}</div>`;
    const mx=n.m?`<div class="mx"><table><thead><tr><th class="l">Invitados</th>${MESES.map(([,l])=>`<th>${l}</th>`).join("")}</tr></thead><tbody>${INV.map(x=>`<tr><td class="l fn">${x}</td>${MESES.map(([m])=>cellTot(total(f,m,x))).join("")}</tr>`).join("")}
      <tr><td class="l muted">€/inv (130)</td>${MESES.map(([m])=>{const t=total(f,m,130);return `<td class="muted">${t?Math.round(t.v/130):"—"}</td>`;}).join("")}</tr></tbody></table></div>`:"";
    const fotos=safeUrl(f.fotos), web=safeUrl(f.web);
    const links=`<div class="links">${fotos?`<a href="${esc(fotos)}" target="_blank" rel="noopener noreferrer">Fotos ↗</a>`:""}${web?`<a href="${esc(web)}" target="_blank" rel="noopener noreferrer">Web ↗</a>`:""}${/@/.test(f.email||"")?`<span class="muted">${esc(f.email)}</span>`:""}</div>`;
    let ed="";
    if(editor()){
      const v=Number((f.votos||{})[YO.w])||0;
      ed=`<div class="edrow">
        <label>Estado<select data-act="estado" data-id="${esc(f.id)}">${ESTADOS.map(e=>`<option ${e===f.estado?"selected":""}>${e}</option>`).join("")}</select></label>
        <label>${YO.w?"Tu voto ("+(YO.w==="javier"?"Javier":"Laura")+")":"Elige arriba quién eres"}<select data-act="voto" data-id="${esc(f.id)}" ${YO.w?"":"disabled"}>${[0,1,2,3,4,5].map(i=>`<option value="${i}" ${i===v?"selected":""}>${i||"–"}</option>`).join("")}</select></label>
        <label>Visita<input type="date" data-act="visita" data-id="${esc(f.id)}" value="${esc(f.visita||"")}"></label></div>`;
    }
    const N=[["Precio","precioTxt"],["Incluye","incluye"],["Mínimos","minimo"],["Para vosotros","importante"],["Opiniones","opiniones"]].filter(([,kk])=>f[kk]);
    const notes=N.length?`<details class="notes"><summary>Notas del dosier</summary><dl>${N.map(([l,kk])=>`<div><dt>${l}</dt><dd>${esc(f[kk])}</dd></div>`).join("")}</dl></details>`:"";
    return `<div class="det-grid">${cells}${mx}${links}${ed}${notes}</div>`;
  }
  function viewDecisiones(){
    const list=S.decisiones.slice().sort((a,b)=>(!!a.decision)-(!!b.decision)||(a.orden||99)-(b.orden||99));
    const inp=(d,kk)=>editor()?`<textarea data-act="dec" data-id="${esc(d.id)}" data-k="${kk}" rows="2">${esc(d[kk]||"")}</textarea>`:(d[kk]?esc(d[kk]):'<span class="nd">–</span>');
    const rows=list.map(d=>`<tr><td class="wrap"><div class="fn">${esc(d.titulo)}</div>${d.contexto?`<div class="sub">${esc(d.contexto)}</div>`:""}</td>
      <td class="wrap">${inp(d,"javier")}</td><td class="wrap">${inp(d,"laura")}</td><td class="wrap">${inp(d,"decision")}</td>
      <td class="c">${d.decision?'<span class="st resp">Hecho</span>':'<span class="st vis">Pendiente</span>'}</td></tr>`).join("");
    return `<div class="bar"></div><div class="tw"><table><thead><tr><th class="l">Decisión</th><th class="l">Javier</th><th class="l">Laura</th><th class="l">Final</th><th class="c">Estado</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  function viewTareas(){
    const hoy=new Date().toISOString().slice(0,10);
    const list=S.tareas.slice().sort((a,b)=>(!!a.hecho)-(!!b.hecho)||String(a.fecha||"9999").localeCompare(String(b.fecha||"9999"))||(a.orden||99)-(b.orden||99));
    const rows=list.map(t=>`<tr class="${t.hecho?"done":""}">
      <td class="c"><input type="checkbox" ${t.hecho?"checked":""} ${editor()?`data-act="tarea" data-id="${esc(t.id)}"`:"disabled"} aria-label="Hecha"></td>
      <td class="wrap tt">${esc(t.texto)}</td><td class="l">${esc(t.quien||"")}</td>
      <td class="${!t.hecho&&t.fecha&&t.fecha<hoy?"late":""}">${t.fecha?esc(new Date(t.fecha+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"})):'<span class="nd">–</span>'}</td></tr>`).join("");
    const add=editor()?`<form class="addbar" id="addTarea"><input id="nt-texto" placeholder="Nueva tarea" required><select id="nt-quien"><option>Javier</option><option>Laura</option><option>Los dos</option><option>Familia</option></select><input id="nt-fecha" type="date"><button class="btn-primary" type="submit">Añadir</button></form>`:"";
    return `<div class="bar"></div><div class="tw"><table><thead><tr><th class="c">✓</th><th class="l">Tarea</th><th class="l">Quién</th><th>Fecha</th></tr></thead><tbody>${rows}</tbody></table></div>${add}`;
  }
  function render(){
    renderKpis();
    const v={fincas:viewFincas,decisiones:viewDecisiones,tareas:viewTareas}[UI.tab]||viewFincas;
    $("#view").innerHTML=v()+(editor()?'<div class="status" id="saveStatus" role="status"></div>':"");
    $("#editbar").hidden=!editor();
    document.querySelectorAll("#editbar [data-yo]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.yo===YO.w)));
    if(editor()) $("#footTxt").textContent="Modo edición: se guarda al momento y lo ven también las familias.";
  }

  // ---------- eventos ----------
  document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{ UI.tab=b.dataset.tab; lsSet("boda-tab",UI.tab); render(); }));
  $("#view").addEventListener("click",e=>{
    const s=e.target.closest("button[data-act]");
    if(s){
      const a=s.dataset.act, v=s.dataset.v;
      if(a==="vista"){UI.vista=v;lsSet("boda-vista",v);}
      else if(a==="inv"){UI.inv=Number(v);lsSet("boda-inv",v);}
      else if(a==="mes"){UI.mes=v;lsSet("boda-mes",v);}
      else if(a==="orden"){UI.orden=v;lsSet("boda-orden",v);}
      render(); return;
    }
    if(e.target.closest("a,select,input,textarea,label,details")) return;
    const r=e.target.closest('tr[data-act="abrir"]');
    if(r){ UI.abierta=UI.abierta===r.dataset.id?"":r.dataset.id; render(); }
  });
  $("#editbar").addEventListener("click",e=>{ const b=e.target.closest("[data-yo]"); if(!b) return; YO.w=b.dataset.yo; lsSet("boda-yo",YO.w); render(); });
  $("#view").addEventListener("submit",e=>{
    if(e.target.id!=="addTarea") return; e.preventDefault();
    const texto=$("#nt-texto").value.trim(); if(!texto) return;
    const id="t"+Date.now().toString(36);
    const o={id,texto,quien:$("#nt-quien").value,fecha:$("#nt-fecha").value||"",hecho:false,orden:99};
    S.tareas.push(o);
    rpc("boda_guardar",{p_password:S.pw,p_coleccion:"tareas",p_id:id,p_data:{texto:o.texto,quien:o.quien,fecha:o.fecha,hecho:false,orden:99}})
      .then(()=>{render();setStatus("Guardado");}).catch(()=>{S.tareas.pop();render();setStatus("No se ha podido guardar la tarea.",true);});
  });
  $("#view").addEventListener("change",e=>{
    const el=e.target, a=el.dataset.act;
    if(a==="ocultar"){ UI.ocultar=el.checked; lsSet("boda-ocultar",el.checked?"1":"0"); render(); return; }
    if(!editor()) return;
    if(a==="estado") guardar("fincas",el.dataset.id,{estado:el.value}).then(render);
    else if(a==="voto"&&YO.w){ const f=S.fincas.find(x=>x.id===el.dataset.id); if(f) guardar("fincas",f.id,{votos:{...(f.votos||{}),[YO.w]:Number(el.value)}}).then(render); }
    else if(a==="visita") guardar("fincas",el.dataset.id,{visita:el.value});
    else if(a==="dec") guardar("decisiones",el.dataset.id,{[el.dataset.k]:el.value}).then(renderKpis);
    else if(a==="tarea") guardar("tareas",el.dataset.id,{hecho:el.checked}).then(render);
  });

  const guardada=getPw();
  if(guardada) entrar(guardada,true); else mostrarLogin("");
})();
</script>
</body>
</html>
