<body>
<div class="app">
  <header>
    <div><a class="eyebrow" href="../#hoy">‹ Mi página</a><h1>Cálculo</h1></div>

  </header>

  </div>
  <p class="small muted sync" id="syncText"><i></i><span></span></p>
</div>

<script>
/* ---------- contenido ---------- */
const FR = [['1/3','33,3%'],['2/3','66,7%'],['1/6','16,7%'],['5/6','83,3%'],['1/7','14,3%'],['1/8','12,5%'],['3/8','37,5%'],['5/8','62,5%'],['7/8','87,5%'],['1/9','11,1%'],['1/11','9,1%'],['1/12','8,3%'],['1/15','6,7%'],['1/16','6,25%'],['1/20','5%'],['1/25','4%']];
const SQ = [[12,144],[13,169],[14,196],[15,225],[16,256],[25,625]];
const POP = [['EE. UU.','~335 M'],['UE','~450 M'],['Alemania','~84 M'],['Reino Unido','~67 M'],['España','~48 M'],['Mundo','~8.000 M']];
const RULES = [
  { q: 'Años para duplicar con un 8% anual (regla del 72)', a: '9 años', d: ['6 años','8 años','12 años'], e: '72 / 8 = 9' },
  { q: 'Años para duplicar con un 6% anual', a: '12 años', d: ['6 años','10 años','16 años'], e: '72 / 6 = 12' },
  { q: 'Regla del 72: ¿cómo se usa?', a: '72 / tasa (%) = años para duplicar', d: ['72 × tasa','tasa / 72','200 / tasa'], e: '72 / tasa (%) = años para duplicar' },
  { q: '¿Cómo sacas el 10% de un número?', a: 'Moviendo la coma una posición', d: ['Dividiendo entre 5','Multiplicando por 1,1','Dividiendo entre 100'], e: 'Mover la coma una posición' },
  { q: '¿Cómo sacas el 5% de un número?', a: 'La mitad del 10%', d: ['Un quinto del número','El doble del 10%','Un cuarto del número'], e: 'Mitad del 10%' },
  { q: '¿Cómo sacas el 15% de un número?', a: '10% + la mitad de ese 10%', d: ['Un quinto del número','10% + 10%','Dividir entre 15'], e: '10% + 5%' },
  { q: '¿Cómo divides un número entre 25?', a: 'Multiplicas por 4 y divides entre 100', d: ['Divides entre 5 y luego entre 4','Multiplicas por 25 y divides entre 1.000','Divides entre 100 y multiplicas por 25'], e: '× 4 y ÷ 100 (340 / 25 = 1.360 / 100 = 13,6)' },
  { q: '% de cambio', a: '(Nuevo − Antiguo) / Antiguo', d: ['(Nuevo − Antiguo) / Nuevo','Nuevo / Antiguo','(Antiguo − Nuevo) / Nuevo'], e: '(Nuevo − Antiguo) / Antiguo' },
  { q: 'Margen bruto', a: '(Ingresos − COGS) / Ingresos', d: ['(Ingresos − COGS) / COGS','COGS / Ingresos','Ingresos / COGS'], e: '(Ingresos − COGS) / Ingresos' },
  { q: 'El cambio de un margen (66% → 65%) se dice en…', a: 'Puntos porcentuales (pp)', d: ['Porcentaje (%)','Variación relativa (%)','Veces (x)'], e: 'Puntos porcentuales: −1 pp, no −1%' },
  { q: 'Atajo para ver el cambio de margen sin calculadora', a: 'Ratio coste/ingresos de cada año y comparar', d: ['Restar los márgenes ya redondeados','Restar el % de cambio de costes al de ingresos','Dividir el beneficio entre los costes'], e: 'Ratio coste/ingresos año 1 y año 2; el margen es 100 menos eso' },
  { q: 'Break-even en unidades', a: 'Costes fijos / (precio − coste variable unitario)', d: ['Costes fijos / precio','Costes variables / (precio − costes fijos)','Costes fijos × margen'], e: 'Costes fijos / margen de contribución unitario' },
  { q: 'Margen de contribución unitario', a: 'Precio − coste variable unitario', d: ['Precio − coste total unitario','Precio − costes fijos','Ingresos − COGS'], e: 'Precio − coste variable unitario' },
  { q: 'Payback', a: 'Inversión / flujo de caja anual', d: ['Flujo de caja anual / inversión','Inversión × tasa','Beneficio / ingresos'], e: 'Inversión / flujo de caja anual' },
  { q: 'ROI', a: 'Beneficio / inversión', d: ['Ingresos / inversión','Beneficio / ingresos','Inversión / beneficio'], e: 'Beneficio / inversión' },
];
const UNITS = [
  { q: '1 B (billion) en millones', a: '1.000 M', d: ['100 M','10.000 M','1 M'] },
  { q: 'Días laborables al año', a: '~250', d: ['~200','~300','~365'] },
  { q: 'Semanas al año', a: '52', d: ['48','50','54'] },
  { q: 'Horas al año (24/7)', a: '~8.760', d: ['~7.300','~10.000','~6.000'] },
  { q: 'Minutos en un día', a: '1.440', d: ['1.200','1.640','2.400'] },
  { q: 'Horas laborables al año de una persona', a: '~2.000', d: ['~1.500','~2.500','~3.000'] },
];

const ITEMS = {}, GROUPS = { frac: [], reg: [], num: [] };
FR.forEach(([f, p]) => { ITEMS['f:' + f] = { kind: 'frac', f, p }; GROUPS.frac.push('f:' + f); });
RULES.forEach((r, i) => { ITEMS['r:' + i] = { kind: 'custom', ...r }; GROUPS.reg.push('r:' + i); });
SQ.forEach(([n, s]) => { ITEMS['s:' + n] = { kind: 'sq', n, s }; GROUPS.num.push('s:' + n); });
POP.forEach(([n, p]) => { ITEMS['p:' + n] = { kind: 'pop', n, p }; GROUPS.num.push('p:' + n); });
UNITS.forEach((u, i) => { ITEMS['u:' + i] = { kind: 'custom', ...u, e: u.a }; GROUPS.num.push('u:' + i); });
const POOL = {
  fp: FR.map(x => x[1]), ff: FR.map(x => x[0]), sq: SQ.map(x => String(x[1])), pop: POP.map(x => x[1]),
};

/* ---------- almacenamiento ---------- */
const $ = s => document.querySelector(s);
const KEY = 'calculo-v1';
const SUPABASE_URL = "https://mwsapcjzubisdszmwswp.supabase.co";
const SUPABASE_KEY = "sb_publishable_oe1TNOb-Y-Lu3jYI8wr5XA_nLDluFOf"; // clave pública: los datos los protege la base de datos
let S = { items: {}, days: {}, updatedAt: 0 };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
let sb = null, syncOn = false, pushT = null;
function save() {
  S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (syncOn) { clearTimeout(pushT); pushT = setTimeout(push, 700); }
}
function setSync(state, txt) { const el = $('#syncText'); if (!el) return; el.className = 'small muted sync ' + state; el.querySelector('span').innerHTML = txt; }
async function push() {
  clearTimeout(pushT); pushT = null;
  const { error } = await sb.from('calculo_progreso').upsert({ id: 'javi', data: S, updated_at: new Date().toISOString() });
  if (error) setSync('err', 'No se pudo guardar en la nube. Se reintentará en la próxima respuesta.');
  else setSync('ok', 'Progreso guardado en tu cuenta');
}
function merge(a, b) {
  const out = { items: {}, days: {}, updatedAt: Math.max(a.updatedAt || 0, b.updatedAt || 0) };
  for (const src of [a, b]) {
    for (const [id, v] of Object.entries(src.items || {})) { const cur = out.items[id]; if (!cur || (v.last || 0) > (cur.last || 0)) out.items[id] = v; }
    for (const [k, v] of Object.entries(src.days || {})) { const cur = out.days[k]; if (!cur || v.n > cur.n) out.days[k] = v; }
  }
  return out;
}
async function initSync() {
  const offTxt = 'Solo en este navegador. <a href="../">Entra en Mi página</a> para guardarlo en tu cuenta.';
  if (!window.supabase) { setSync('', offTxt); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'mi-pagina-auth' } });
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { setSync('', offTxt); return; }
  const { data, error } = await sb.from('calculo_progreso').select('data').eq('id', 'javi').maybeSingle();
  if (error) { setSync('err', 'No se pudo leer tu progreso de la nube. Recarga para reintentar.'); return; }
  syncOn = true;
  if (data && data.data) S = merge(S, data.data);
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  await push();
  renderToday();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && syncOn && pushT) push(); });
function st(id) { return S.items[id] || { box: 0, seen: 0, ok: 0, ko: 0 }; }
function record(id, right) {
  const s = st(id);
  s.seen++; if (right) { s.ok++; s.box = Math.min(5, s.box + 1); } else { s.ko++; s.box = 0; }
  s.last = Date.now(); S.items[id] = s; save();
}
function dayKey(d = new Date()) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const GOAL = 10;
const dayDone = k => S.days[k] && S.days[k].n >= GOAL;
function streak() {
  let n = 0; const d = new Date();
  if (!dayDone(dayKey(d))) d.setDate(d.getDate() - 1);
  while (dayDone(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ---------- utilidades ---------- */
const rnd = n => Math.floor(Math.random() * n);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function weight(id) { const s = st(id); if (!s.seen) return 16; return [25, 16, 9, 4, 2, 1][s.box]; }
function weightedPick(ids, n) {
  const pool = ids.slice(), out = [];
  while (out.length < n && pool.length) {
    const tot = pool.reduce((a, id) => a + weight(id), 0); let r = Math.random() * tot, k = 0;
    for (; k < pool.length; k++) { r -= weight(pool[k]); if (r <= 0) break; }
    out.push(pool.splice(Math.min(k, pool.length - 1), 1)[0]);
  }
  return out;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function wrongFrom(pool, right) { return shuffle(pool.filter(x => x !== right)).slice(0, 3); }

/* ---------- preguntas ---------- */
function makeQ(id) {
  const it = ITEMS[id];
  let prompt, right, wrong, expl;
  if (it.kind === 'frac') {
    if (Math.random() < 0.5) { prompt = `<em>${it.f}</em> en porcentaje`; right = it.p; wrong = wrongFrom(POOL.fp, it.p); }
    else { prompt = `<em>${it.p}</em> equivale a…`; right = it.f; wrong = wrongFrom(POOL.ff, it.f); }
    expl = `<b>${it.f}</b> = <b>${it.p}</b>`;
  } else if (it.kind === 'sq') {
    prompt = `<em>${it.n}²</em>`; right = String(it.s); wrong = wrongFrom(POOL.sq, right); expl = `<b>${it.n}²</b> = <b>${it.s}</b>`;
  } else if (it.kind === 'pop') {
    prompt = `Población de <em>${esc(it.n)}</em>`; right = it.p; wrong = wrongFrom(POOL.pop, right); expl = `<b>${esc(it.n)}</b>: ${esc(it.p)}`;
  } else {
    prompt = `<em>${esc(it.q)}</em>`; right = it.a; wrong = it.d; expl = `<b>${esc(it.q)}</b> · ${esc(it.e || it.a)}`;
  }
  const options = shuffle([right, ...wrong]).map(t => ({ text: t, ok: t === right }));
  return { id, prompt, options, expl };
}

/* ---------- una pregunta cada vez ---------- */
let cur = null, lastId = null, extra = false, timer = null, t0 = 0;
function today() { return S.days[dayKey()] || { right: 0, n: 0, t: Date.now() }; }
function renderToday() {
  const d = today(), n = Math.min(d.n, GOAL);
  $('#todayTxt').textContent = d.n >= GOAL ? `Hoy: ${GOAL} de ${GOAL}` : `Hoy: ${n} de ${GOAL}`;
  $('#todayOk').textContent = d.n ? `${d.right} ${d.right === 1 ? 'acierto' : 'aciertos'}` : '';
  $('#todayBar').style.width = (n / GOAL * 100) + '%';
  $('#streakN').textContent = streak();
}
function nextQuestion() {
  clearTimeout(timer);
  renderToday();
  if (today().n >= GOAL && !extra) { showDone(); return; }
  $('#done').hidden = true; $('#quiz').hidden = false;
  const r = Math.random(), g = r < 0.4 ? 'frac' : r < 0.8 ? 'reg' : 'num';
  const id = weightedPick(GROUPS[g].filter(x => x !== lastId), 1)[0];
  lastId = id;
  cur = makeQ(id);
  $('#qPrompt').innerHTML = cur.prompt;
  $('#qFb').hidden = true; $('#qNextRow').hidden = true;
  $('#qOpts').innerHTML = cur.options.map((o, i) => `<button type="button" class="opt" data-i="${i}">${esc(o.text)}</button>`).join('');
  t0 = Date.now();
}
const answered = () => !$('#qFb').hidden;
$('#qOpts').addEventListener('click', e => {
  const b = e.target.closest('.opt'); if (!b || answered()) return;
  const right = cur.options[+b.dataset.i].ok;
  const secs = Math.max(1, Math.round((Date.now() - t0) / 1000));
  $('#qOpts').querySelectorAll('.opt').forEach(o => { o.disabled = true; if (cur.options[+o.dataset.i].ok) o.classList.add('ok'); });
  if (!right) b.classList.add('ko');
  finish(right, (right ? 'Bien. ' : 'No. ') + cur.expl + ` <span class="muted" style="white-space:nowrap">· ${secs}&nbsp;s</span>`);
});
function finish(right, html) {
  record(cur.id, right);
  const k = dayKey(), d = today();
  S.days[k] = { right: d.right + (right ? 1 : 0), n: d.n + 1, t: Date.now() };
  save();
  const fb = $('#qFb'); fb.className = 'feedback ' + (right ? 'ok' : 'ko'); fb.innerHTML = html; fb.hidden = false;
  renderToday();
  $('#qNextRow').hidden = false;
  if (right) timer = setTimeout(nextQuestion, 1400);
}
$('#qNext').addEventListener('click', nextQuestion);
function showDone() {
  const d = today();
  $('#quiz').hidden = true; $('#done').hidden = false;
  $('#doneScore').textContent = `${d.right}/${d.n}`;
  const s = streak();
  $('#doneTxt').textContent = `Llevas ${s} ${s === 1 ? 'día' : 'días'} seguidos. Mañana, 10 más.`;
}
$('#more').addEventListener('click', () => { extra = true; nextQuestion(); });

/* ---------- chuleta ---------- */
function renderCheat() {
  const grid = arr => `<div class="grid">${arr.map(([a, b]) => `<div><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('')}</div>`;
  $('#cheat').innerHTML =
    `<h3>Fracciones a %</h3>${grid(FR)}` +
    `<h3>Reglas y fórmulas</h3><ul>${RULES.map(r => `<li><b>${esc(r.q)}:</b> ${esc(r.e || r.a)}</li>`).join('')}</ul>` +
    `<h3>Cuadrados</h3>${grid(SQ.map(([n, s]) => [n + '²', s]))}` +
    `<h3>Unidades</h3>${grid(UNITS.map(u => [u.q, u.a]))}` +
    `<h3>Poblaciones (para sizing)</h3>${grid(POP)}`;
}
renderCheat();
nextQuestion();
initSync();
</script>
</body>
