<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi página</title>
<meta name="description" content="Resúmenes diarios: correo, ofertas de trabajo, noticias y cambio euro-dólar.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi página">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #eef0f3;
  --glass: rgba(255,255,255,.72);
  --glass-strong: rgba(255,255,255,.9);
  --glass-line: rgba(255,255,255,.9);
  --hair: rgba(20,24,31,.08);
  --ink: #111318;
  --ink-2: #4a4f59;
  --ink-3: #7c818b;
  --accent: #0a66d8;
  --good: #1a7f4b;  --good-bg: rgba(52,199,89,.14);
  --mid: #9a6200;   --mid-bg: rgba(255,159,10,.16);
  --bad: #c0352b;   --bad-bg: rgba(255,59,48,.12);
  --chip: rgba(20,24,31,.06);
  --shadow: 0 1px 1px rgba(15,20,30,.04), 0 10px 30px -10px rgba(15,20,30,.18);
  --blob-a: #cfe1ff; --blob-b: #ffe4cc; --blob-c: #d9f2e6;
  --r: 26px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f12; --glass: rgba(38,41,48,.62); --glass-strong: rgba(44,47,55,.92); --glass-line: rgba(255,255,255,.08);
    --hair: rgba(255,255,255,.08); --ink: #f3f4f6; --ink-2: #b9bdc6; --ink-3: #8a8f99; --accent: #5aa2ff;
    --good: #6fdc98; --good-bg: rgba(52,199,89,.18); --mid: #ffc456; --mid-bg: rgba(255,159,10,.18); --bad: #ff8a80; --bad-bg: rgba(255,69,58,.18);
    --chip: rgba(255,255,255,.08); --shadow: 0 10px 30px -12px rgba(0,0,0,.6);
    --blob-a: #16305a; --blob-b: #3a2516; --blob-c: #123a2a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f12; --glass: rgba(38,41,48,.62); --glass-strong: rgba(44,47,55,.92); --glass-line: rgba(255,255,255,.08);
  --hair: rgba(255,255,255,.08); --ink: #f3f4f6; --ink-2: #b9bdc6; --ink-3: #8a8f99; --accent: #5aa2ff;
  --good: #6fdc98; --good-bg: rgba(52,199,89,.18); --mid: #ffc456; --mid-bg: rgba(255,159,10,.18); --bad: #ff8a80; --bad-bg: rgba(255,69,58,.18);
  --chip: rgba(255,255,255,.08); --shadow: 0 10px 30px -12px rgba(0,0,0,.6);
  --blob-a: #16305a; --blob-b: #3a2516; --blob-c: #123a2a; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); background: var(--bg);
  font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; letter-spacing: -.01em;
  padding-bottom: calc(110px + env(safe-area-inset-bottom));
  min-height: 100vh;
}
/* Fondo tranquilo: tres manchas de color muy suaves */
body::before {
  content: ""; position: fixed; inset: -20vmax; z-index: -1; pointer-events: none;
  background:
    radial-gradient(40vmax 40vmax at 15% 10%, var(--blob-a), transparent 70%),
    radial-gradient(35vmax 35vmax at 90% 30%, var(--blob-b), transparent 70%),
    radial-gradient(40vmax 40vmax at 40% 95%, var(--blob-c), transparent 70%);
  opacity: .8;
}
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
[tabindex="-1"]:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -60px; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; z-index: 60; }
.skip:focus { top: 12px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
.glass {
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: var(--r);
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: saturate(1.6) blur(24px); backdrop-filter: saturate(1.6) blur(24px);
}

/* Cabecera */
header.top { padding-top: calc(22px + env(safe-area-inset-top)); padding-bottom: 4px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 0; }
.large { font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -.025em; margin: 4px 0 0; }
.top-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.tools { display: flex; gap: 8px; align-items: center; }
.circle {
  width: 40px; height: 40px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--glass-line); background: var(--glass); cursor: pointer; box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
.circle svg { width: 18px; height: 18px; }
.dayline { margin-top: 14px; }
.daypick { position: relative; display: inline-flex; align-items: center; }
.daypick select {
  appearance: none; -webkit-appearance: none; border: 0; background: var(--chip); border-radius: 999px;
  padding: 8px 34px 8px 14px; font-size: 15px; font-weight: 600; color: var(--ink-2); cursor: pointer; min-height: 36px;
}
.daypick svg { position: absolute; right: 12px; width: 14px; height: 14px; pointer-events: none; color: var(--ink-3); }

/* Pestañas flotantes tipo ornamento */
nav.tabs {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 30;
  padding: 6px; border-radius: 999px; width: max-content; max-width: calc(100% - 24px);
}
nav.tabs ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 2px; }
nav.tabs a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-width: 62px; min-height: 52px; padding: 0 10px; border-radius: 999px;
  font-size: 11px; font-weight: 600; color: var(--ink-3); transition: background .2s, color .2s;
}
nav.tabs a svg { width: 22px; height: 22px; }
nav.tabs a[aria-current="page"] { background: var(--glass-strong); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }

main section { padding-top: 22px; }
main section[hidden] { display: none; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 4px 14px; }
.sec-title { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 0; line-height: 1.15; }
.stamp { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.panel { padding: 22px; margin: 0 0 14px; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 15px; }
.tiny { font-size: 13px; }
.lede { font-size: 21px; line-height: 1.38; letter-spacing: -.015em; font-weight: 500; margin: 0; }
.empty { text-align: center; padding: 40px 24px; color: var(--ink-2); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin-right: 8px; vertical-align: 1px; }
.dot.good { background: var(--good); } .dot.mid { background: var(--mid); } .dot.bad { background: var(--bad); }
.label { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.label.bad { color: var(--bad); } .label.good { color: var(--good); } .label.acc { color: var(--accent); }

/* Hoy */
.hero { padding: 26px 24px; margin-bottom: 14px; display: block; }
.hero .label { margin-bottom: 10px; }
.hero h2 { font-size: 26px; line-height: 1.22; letter-spacing: -.02em; margin: 0; font-weight: 700; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile { padding: 18px; display: flex; flex-direction: column; justify-content: space-between; min-height: 150px; transition: transform .15s; }
.tile:active { transform: scale(.98); }
.tile .k { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
.tile .k svg { width: 18px; height: 18px; }
.tile .v { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; margin-top: 14px; }
.tile .s { font-size: 14px; color: var(--ink-2); margin-top: 6px; line-height: 1.35; }
.tile.wide { grid-column: 1 / -1; min-height: 0; }
.headlist { list-style: none; margin: 10px 0 0; padding: 0; }
.headlist li { padding: 10px 0; border-top: 1px solid var(--hair); font-weight: 600; font-size: 16px; line-height: 1.35; }
.headlist li:first-child { border-top: 0; padding-top: 4px; }

/* Listas */
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li { padding: 16px 0; border-top: 1px solid var(--hair); }
.rows > li:first-child { border-top: 0; padding-top: 0; }
.rows > li:last-child { padding-bottom: 0; }
.row { display: flex; gap: 14px; align-items: flex-start; }
.row .grow { flex: 1; min-width: 0; }
.t { font-weight: 650; font-size: 17px; line-height: 1.3; }
.m { font-size: 14px; color: var(--ink-3); margin-top: 2px; }
.b { color: var(--ink-2); margin: 6px 0 0; font-size: 16px; line-height: 1.45; }
.check { flex: none; width: 44px; height: 44px; margin: -10px -10px 0 0; border: 0; background: none; cursor: pointer; color: var(--ink-3); display: inline-flex; align-items: center; justify-content: center; }
.check svg { width: 26px; height: 26px; }
.check[aria-pressed="true"] { color: var(--good); }
li.done .t, li.done .b { opacity: .45; }
.group-title { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 12px; }

/* Segmentos y chips */
.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; min-height: 34px; padding: 0 14px; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 4px 12px; margin: 0 -20px 4px; padding-left: 24px; padding-right: 24px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; border: 1px solid var(--glass-line); background: var(--glass); border-radius: 999px; min-height: 36px; padding: 0 14px; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Noticias */
.carousel { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -20px 18px; padding: 4px 20px 16px; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.story-big { flex: 0 0 84%; scroll-snap-align: center; padding: 22px; min-height: 190px; display: flex; flex-direction: column; justify-content: space-between; max-width: 420px; }
.story-big .n { font-size: 44px; font-weight: 800; letter-spacing: -.04em; color: var(--ink-3); opacity: .45; line-height: 1; }
.story-big h3 { font-size: 22px; line-height: 1.25; letter-spacing: -.02em; margin: 14px 0 10px; }
.story { padding: 20px 22px; margin-bottom: 12px; display: block; }
.story h3 { font-size: 19px; line-height: 1.3; letter-spacing: -.015em; margin: 6px 0 6px; }
.story p { margin: 0; color: var(--ink-2); font-size: 16px; }
.story .src { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--accent); }
.story .src svg { width: 14px; height: 14px; }

/* Empleo */
.job { padding: 22px; margin-bottom: 12px; }
.job h3 { font-size: 20px; line-height: 1.28; letter-spacing: -.02em; margin: 6px 0 4px; }
.job .co { color: var(--ink-2); font-size: 15px; margin: 0; }
.job .why { margin: 14px 0 0; font-size: 16px; line-height: 1.45; }
.job .money { margin: 12px 0 0; font-size: 15px; font-weight: 600; }
.job details { margin-top: 12px; }
.job summary { cursor: pointer; font-size: 15px; font-weight: 600; color: var(--accent); min-height: 32px; display: flex; align-items: center; list-style: none; }
.job summary::-webkit-details-marker { display: none; }
.job dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 8px 0 0; font-size: 15px; }
.job dt { color: var(--ink-3); font-weight: 600; font-size: 13px; padding-top: 2px; }
.job dd { margin: 0; color: var(--ink-2); }
.tags { display: flex; flex-wrap: wrap; gap: 10px; }
.actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.btn {
  min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--chip); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: var(--ink);
}
.btn.primary { background: var(--ink); color: var(--bg); }
.btn[aria-pressed="true"] { background: var(--good-bg); color: var(--good); }
.btn svg { width: 17px; height: 17px; }
.linkish { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 10px 4px; min-height: 44px; font-weight: 600; font-size: 15px; }

/* Cambio */
.fx-big { font-size: 64px; line-height: 1; font-weight: 700; letter-spacing: -.045em; font-variant-numeric: tabular-nums; margin: 6px 0 0; }
.fx-unit { font-size: 17px; color: var(--ink-2); margin-top: 8px; }
.verdict { display: flex; gap: 12px; align-items: flex-start; border-radius: 18px; padding: 14px 16px; margin: 20px 0 0; }
.verdict.good { background: var(--good-bg); } .verdict.mid { background: var(--mid-bg); } .verdict.bad { background: var(--bad-bg); }
.verdict strong { display: block; font-size: 17px; }
.verdict.good strong { color: var(--good); } .verdict.mid strong { color: var(--mid); } .verdict.bad strong { color: var(--bad); }
.verdict span { color: var(--ink); font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 18px; }
.stats div { padding: 4px 0; }
.stats div + div { border-left: 1px solid var(--hair); padding-left: 14px; }
.stats b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stats span { font-size: 13px; color: var(--ink-3); }
.up { color: var(--bad); } .down { color: var(--good); }
.meter { margin-top: 18px; }
.meter-track { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--good), var(--mid) 50%, var(--bad)); opacity: .85; }
.meter-mark { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 9px; background: var(--glass-strong); border: 3px solid var(--ink); transform: translate(-9px, -50%); }
.meter-l { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-3); margin-top: 8px; }
figure.chart { margin: 0; }
figure.chart svg { width: 100%; height: auto; display: block; }
figure.chart figcaption { font-size: 13px; color: var(--ink-3); margin-top: 8px; }

/* Frase del día */
.quote { padding: 26px 24px 22px; margin-bottom: 14px; }
.quote blockquote { margin: 0; font-family: ui-serif, "New York", Georgia, "Times New Roman", serif; font-size: 23px; line-height: 1.35; letter-spacing: -.01em; font-weight: 500; }
.quote blockquote::before { content: "“"; display: block; font-size: 54px; line-height: .6; color: var(--accent); opacity: .5; margin-bottom: 6px; }
.quote figcaption { margin-top: 12px; font-size: 14px; color: var(--ink-3); font-weight: 600; }

/* Imágenes */
.media { overflow: hidden; background: var(--chip); }
.media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero.has-img { padding: 0; overflow: hidden; }
.hero .media { aspect-ratio: 16 / 9; }
.hero .hero-body { padding: 20px 24px 24px; }
.story-big.has-img { padding: 0; overflow: hidden; justify-content: flex-start; }
.story-big .media { aspect-ratio: 16 / 10; }
.story-big:not(.has-img) .sb-body { padding: 0; }
.story-big .sb-body { padding: 18px 20px 20px; display: flex; flex-direction: column; justify-content: space-between; flex: 1; }
.story-big h3 { margin-top: 0; }
.story.with-thumb { display: flex; gap: 16px; align-items: flex-start; }
.story .thumb { flex: none; width: 92px; height: 92px; border-radius: 16px; order: 2; }
.story .story-text { flex: 1; min-width: 0; }

/* Logos */
.job-top { display: flex; gap: 14px; align-items: center; }
.logo { flex: none; width: 48px; height: 48px; border-radius: 13px; background: var(--glass-strong); border: 1px solid var(--hair); display: flex; align-items: center; justify-content: center; overflow: hidden; font-weight: 700; font-size: 17px; color: var(--ink-2); }
.logo img { width: 32px; height: 32px; object-fit: contain; }
.job-top .co { margin: 0; }
.job-top .who { font-weight: 650; font-size: 16px; }

/* Acceso */
.login { max-width: 420px; margin: 0 auto; padding: calc(12vh + env(safe-area-inset-top)) 20px 40px; }
.login .panel { padding: 28px 24px; }
.field { display: block; margin: 14px 0; }
.field span { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 0 6px 4px; }
.field input { width: 100%; min-height: 50px; border-radius: 14px; border: 1px solid var(--hair); background: var(--glass-strong); padding: 0 16px; font-size: 17px; }
.msg { min-height: 22px; margin: 8px 4px; font-size: 15px; }
.msg.err { color: var(--bad); } .msg.ok { color: var(--good); }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 15px; font-weight: 600; z-index: 40; max-width: calc(100% - 32px); }
.loading { text-align: center; color: var(--ink-3); padding: 60px 0; }
.foot { text-align: center; margin: 30px 0 0; }
</style>
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>

<!-- Acceso -->
<div id="loginView" class="login" hidden>
  <img src="icon-192.png" alt="" width="64" height="64" style="display:block;border-radius:16px;margin:0 0 18px;box-shadow:var(--shadow)">
  <p class="eyebrow">Bienvenido</p>
  <h1 class="large" style="margin-bottom:22px">Mi página</h1>
  <div class="glass panel">
    <p class="muted" id="loginIntro" style="margin:0 0 4px">Entra con tu correo y contraseña.</p>
    <form id="loginForm" novalidate>
      <label class="field"><span>Correo</span><input id="email" type="email" autocomplete="username" inputmode="email" required></label>
      <label class="field"><span>Contraseña</span><input id="password" type="password" autocomplete="current-password" required minlength="8"></label>
      <p id="loginMsg" class="msg" role="status" aria-live="polite"></p>
      <button class="btn primary" type="submit" id="loginBtn" style="width:100%;justify-content:center;min-height:50px">Entrar</button>
    </form>
  </div>
  <p style="text-align:center"><button class="linkish" type="button" id="toggleMode">¿Primera vez? Crear mi cuenta</button></p>
</div>

<!-- App -->
<div id="appView" hidden>
  <header class="top wrap">
    <div class="top-row">
      <div>
        <p class="eyebrow" id="todayLabel"></p>
        <h1 class="large" id="hello">Hola, Javi</h1>
      </div>
      <div class="tools">
        <button class="circle" id="refreshBtn" type="button" aria-label="Actualizar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
        </button>
      </div>
    </div>
    <div class="dayline">
      <label for="daySel" class="sr-only">Día que quieres ver</label>
      <span class="daypick"><select id="daySel"></select><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
    </div>
  </header>

  <main id="contenido" class="wrap" tabindex="-1">
    <p class="loading" id="loading" role="status">Cargando…</p>
    <section id="v-hoy" aria-labelledby="h-hoy" hidden></section>
    <section id="v-correo" aria-labelledby="h-correo" hidden></section>
    <section id="v-empleo" aria-labelledby="h-empleo" hidden></section>
    <section id="v-noticias" aria-labelledby="h-noticias" hidden></section>
    <section id="v-cambio" aria-labelledby="h-cambio" hidden></section>
    <p class="foot tiny faint">
      <button class="linkish" type="button" id="themeBtn">Tema claro / oscuro</button> ·
      <button class="linkish" type="button" id="logoutBtn">Cerrar sesión</button>
    </p>

function logo(o) {

  return `<span class="logo" data-ini="${esc(ini)}" aria-hidden="true">${domainOk(d) ? `<img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(d)}&sz=128" alt="" loading="lazy" referrerpolicy="no-referrer">` : esc(ini)}</span>`;
}

// Frase del día (cambia cada día)
const FRASES = [
  ["No es que tengamos poco tiempo, es que perdemos mucho.", "Séneca"],

];
function fraseDeHoy() {
  const t = todayISO(); const n = Math.floor(Date.parse(t + "T00:00:00Z") / 864e5);
  return FRASES[((n % FRASES.length) + FRASES.length) % FRASES.length];
}

function todayISO() { return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }
function dayLabel(iso, long = true) {
  if (!iso) return "";
  const t = todayISO();
  const y = new Date(Date.parse(t + "T12:00:00Z") - 864e5).toISOString().slice(0, 10);
  if (iso === t) return "Hoy";
  if (iso === y) return "Ayer";
  const s = new Date(iso + "T12:00:00Z").toLocaleDateString("es-ES", long ? { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" } : { day: "numeric", month: "short", timeZone: "UTC" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const timeLabel = (ts) => ts ? new Date(ts).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit", timeZone: TZ }) : "";
const stamp = (r) => r ? `${dayLabel(r.run_date, false)}, ${timeLabel(r.created_at)}` : "";
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2400); }

// ---------- Tema ----------
try { const t = localStorage.getItem("mp-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
$("#themeBtn").addEventListener("click", () => {

  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("mp-theme", next); } catch {}
});

// ---------- Acceso ----------
let signUpMode = false;
$("#toggleMode").addEventListener("click", () => {
  signUpMode = !signUpMode;
  $("#loginBtn").textContent = signUpMode ? "Crear cuenta" : "Entrar";

  $("#password").autocomplete = signUpMode ? "new-password" : "current-password";

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("#email").value.trim(), password = $("#password").value, msg = $("#loginMsg");
  msg.className = "msg";
  if (!email || password.length < 8) { msg.classList.add("err"); msg.textContent = "Pon tu correo y una contraseña de al menos 8 caracteres."; return; }

    if (signUpMode) {

    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });

  } finally { $("#loginBtn").disabled = false; }
});
$("#logoutBtn").addEventListener("click", async () => { await sb.auth.signOut(); });
const showLogin = () => { $("#appView").hidden = true; $("#loginView").hidden = false; };
const showApp = () => { $("#loginView").hidden = true; $("#appView").hidden = false; };

// ---------- Datos ----------
async function loadData() {
  $("#loading").hidden = digests.length > 0;
  const [d, m] = await Promise.all([
    sb.from("digests").select("kind, run_date, created_at, headline, data").order("run_date", { ascending: false }).order("created_at", { ascending: false }).limit(240),
    sb.from("item_marks").select("item_key, mark")
  ]);
  $("#loading").hidden = true;
  if (d.error) { toast("No se pudieron cargar los datos"); console.error(d.error); return; }
  digests = d.data || [];
  marks = new Map((m.data || []).map(r => [r.item_key, r.mark]));
  buildDaySelect(); render();
}
async function setMark(key, mark) {
  const prev = marks.get(key);
  if (prev === mark) {
    marks.delete(key); render();
    const { error } = await sb.from("item_marks").delete().eq("item_key", key);
    if (error) { marks.set(key, prev); render(); toast("No se guardó"); }
    return;
  }
  marks.set(key, mark); render();
  const { error } = await sb.from("item_marks").upsert({ item_key: key, mark, updated_at: new Date().toISOString() });
  if (error) { if (prev) marks.set(key, prev); else marks.delete(key); render(); toast("No se guardó"); }
}
function buildDaySelect() {
  const sel = $("#daySel");
  const dates = [...new Set(digests.map(r => r.run_date))];
  sel.innerHTML = `<option value="latest">Lo más reciente</option>` + dates.map(d => `<option value="${esc(d)}">${esc(dayLabel(d))}</option>`).join("");
  if (day !== "latest" && !dates.includes(day)) day = "latest";
  sel.value = day;
}
$("#daySel").addEventListener("change", (e) => { day = e.target.value; render(); });
function pick(kind) {
  const rows = digests.filter(r => r.kind === kind);
  return day === "latest" ? (rows[0] || null) : (rows.find(r => r.run_date === day) || null);
}

}
window.addEventListener("hashchange", () => setView(location.hash.slice(1), true));

// ---------- Iconos ----------
const I = {
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg>',
  job: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/></svg>',

  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/></svg>',

  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',

};
const VERD = { bueno: ["good", "Buen día para cambiar"], normal: ["mid", "Normal, cambia si lo necesitas"], esperar: ["bad", "Mejor esperar un poco"] };
const head = (id, title, r) => `<div class="sec-head"><h2 class="sec-title" id="h-${id}">${esc(title)}</h2>${r ? `<span class="stamp">${esc(stamp(r))}</span>` : ""}</div>`;

function render() {

  $("#hello").textContent = (h < 6 ? "Buenas noches" : h < 13 ? "Buenos días" : h < 21 ? "Buenas tardes" : "Buenas noches") + ", Javi";

}

// ---------- Hoy ----------
function renderHoy() {
  const c = pick("correo"), e = pick("empleo"), n = pick("noticias"), x = pick("cambio");
  let h = `<h2 class="sr-only" id="h-hoy">Resumen de hoy</h2>`;
  const [fr, au] = fraseDeHoy();
  h += `<figure class="glass quote" style="margin:0 0 14px"><blockquote>${esc(fr)}</blockquote><figcaption>${esc(au)}</figcaption></figure>`;
  const top = arr(n?.data?.destacadas)[0];
  if (top) {
    const im = img(top.imagen);
    h += `<a class="glass hero ${im ? "has-img" : ""}" href="#noticias">${im}<div class="${im ? "hero-body" : ""}"><span class="label acc">Lo más importante</span><h2>${esc(top.titulo)}</h2>${top.fuente ? `<p class="tiny faint" style="margin:10px 0 0">${esc(top.fuente)}</p>` : ""}</div></a>`;
  }
  h += `<div class="tiles">`;
  // Cambio
  if (x) {
    const d = x.data || {}; const v = VERD[d.veredicto] || ["", ""];
    h += `<a class="glass tile" href="#cambio"><span class="k">${I.fx}Euro / dólar</span><div><div class="v">${num(toNum(d.eur_usd))}</div><div class="s"><span class="dot ${v[0]}"></span>${esc(d.veredicto_texto || v[1])}</div></div></a>`;
  } else h += `<a class="glass tile" href="#cambio"><span class="k">${I.fx}Euro / dólar</span><div class="s">Sin datos aún</div></a>`;
  // Correo
  if (c) {
    const d = c.data || {}; const urg = arr(d.urgente).length, imp = arr(d.importante).length;
    const pend = [...arr(d.urgente).map((_, k) => "u" + k), ...arr(d.importante).map((_, k) => "i" + k)].filter(k => marks.get("correo:" + c.run_date + ":" + k) !== "hecho").length;
    h += `<a class="glass tile" href="#correo"><span class="k">${I.mail}Correo</span><div><div class="v">${pend}</div><div class="s">${pend === 1 ? "cosa por atender" : "cosas por atender"}${urg ? ` · <span style="color:var(--bad)">${urg} urgente${urg > 1 ? "s" : ""}</span>` : ""}</div></div></a>`;
  } else h += `<a class="glass tile" href="#correo"><span class="k">${I.mail}Correo</span><div class="s">Llega a las 21:00</div></a>`;
  // Empleo
  if (e) {
    const of = arr(e.data?.ofertas); const nuevas = of.filter(o => o.nueva).length;
    h += `<a class="glass tile" href="#empleo"><span class="k">${I.job}Empleo</span><div><div class="v">${of.length}</div><div class="s">oferta${of.length === 1 ? "" : "s"} que encajan${nuevas ? ` · ${nuevas} nueva${nuevas > 1 ? "s" : ""}` : ""}</div></div></a>`;
  } else h += `<a class="glass tile" href="#empleo"><span class="k">${I.job}Empleo</span><div class="s">Llega por la mañana</div></a>`;

  if (n) {
    const cnt = arr(n.data?.secciones).reduce((a, s) => a + arr(s.items).length, 0);
    h += `<a class="glass tile" href="#noticias"><span class="k">${I.news}Noticias</span><div><div class="v">${cnt}</div><div class="s">historias en ${arr(n.data?.secciones).filter(s => arr(s.items).length).length} secciones</div></div></a>`;
  } else h += `<a class="glass tile" href="#noticias"><span class="k">${I.news}Noticias</span><div class="s">Llega por la mañana</div></a>`;
  h += `</div>`;
  // Titulares 2 y 3
  const rest = arr(n?.data?.destacadas).slice(1, 3);
  if (rest.length) h += `<div class="glass panel" style="margin-top:14px"><p class="group-title">También hoy</p><ul class="headlist">${rest.map(t => `<li>${esc(t.titulo)}</li>`).join("")}</ul></div>`;

}

// ---------- Noticias ----------
function renderNoticias() {
  const r = pick("noticias"), el = $("#v-noticias");
  if (!r) { el.innerHTML = head("noticias", "Noticias") + emptyBox(day === "latest" ? "Aún no hay noticias. Llegan cada mañana a las 5:40." : "Ese día no hubo noticias."); return; }
  const d = r.data || {};
  let h = head("noticias", "Noticias", r);
  const top = arr(d.destacadas);
  if (top.length) {
    h += `<div class="carousel" role="list" aria-label="Lo más importante">${top.map((t, i) => {
      const u = safeUrl(t.url);
      const im = img(t.imagen);
      const inner = im
        ? `${im}<div class="sb-body"><h3>${esc(t.titulo)}</h3><span class="label acc">${i + 1} · ${esc(t.fuente || "Leer")}${u ? NEWTAB : ""}</span></div>`
        : `<div><span class="n" aria-hidden="true">${i + 1}</span><h3>${esc(t.titulo)}</h3></div><span class="label acc">${esc(t.fuente || "Leer")}${u ? NEWTAB : ""}</span>`;

    if (s.nota && !items.length) h += emptyBox(s.nota);
    else if (s.nota) h += `<p class="small muted" style="margin:0 4px 12px">${esc(s.nota)}</p>`;
    h += items.map(it => {
      const u = safeUrl(it.url);
      const th = img(it.imagen, "thumb");
      const inner = `${th}<div class="story-text"><h3>${esc(it.titulo)}</h3>${it.resumen ? `<p>${esc(it.resumen)}</p>` : ""}<span class="src">${esc(it.fuente || "Leer")}${it.de_pago ? " · de pago" : ""} ${u ? I.arrow : ""}</span>${u ? NEWTAB : ""}</div>`;

    }).join("");
  }

  el.innerHTML = h;
}

    ${urgent ? '<span class="label bad">Urgente</span>' : ""}
    <div class="t">${esc(it.asunto || it.titulo || "")}</div>
    <div class="m">${esc([it.de, it.fecha_limite ? "hasta " + it.fecha_limite : ""].filter(Boolean).join(" · "))}</div>
    ${it.detalle ? `<p class="b">${esc(it.detalle)}</p>` : ""}
    ${it.accion ? `<p class="b" style="color:var(--ink)">→ ${esc(it.accion)}</p>` : ""}
  </div><button class="check" type="button" data-mark="${esc(key)}" data-val="hecho" aria-pressed="${done}" aria-label="Marcar como hecho: ${esc(it.asunto || "")}">${done ? I.checkOn : I.check}</button></div></li>`;
}
function renderCorreo() {
  const r = pick("correo"), el = $("#v-correo");
  if (!r) { el.innerHTML = head("correo", "Correo") + emptyBox(day === "latest" ? "Aún no hay resumen del correo. Llega cada noche a las 21:00." : "Ese día no hubo resumen del correo."); return; }
  const d = r.data || {}, base = "correo:" + r.run_date + ":";
  let h = head("correo", "Correo", r);
  h += `<div class="glass panel"><p class="lede">${esc(d.resumen || r.headline || "")}</p>${d.revisados ? `<p class="tiny faint" style="margin:12px 0 0">${esc(d.revisados)} correos revisados</p>` : ""}</div>`;
  const u = arr(d.urgente), i = arr(d.importante), o = arr(d.otros);
  if (u.length || i.length) h += `<div class="glass panel"><p class="group-title">Para atender</p><ul class="rows">${u.map((x, k) => mailItem(x, base + "u" + k, true)).join("")}${i.map((x, k) => mailItem(x, base + "i" + k, false)).join("")}</ul></div>`;
  if (o.length) h += `<div class="glass panel"><p class="group-title">Para que lo sepas</p><ul class="rows">${o.map((x, k) => mailItem(x, base + "o" + k, false)).join("")}</ul></div>`;
  const ea = arr(d.eventos_anadidos), ep = arr(d.eventos_pendientes);
  if (ea.length || ep.length) h += `<div class="glass panel"><p class="group-title">Calendario</p><ul class="rows">
    ${ea.map(x => `<li><span class="label good">Añadido</span><div class="t">${esc(x.titulo)}</div><div class="m">${esc(x.cuando || "")}${x.origen ? " · " + esc(x.origen) : ""}</div></li>`).join("")}
    ${ep.map(x => `<li><span class="label bad">Sin añadir</span><div class="t">${esc(x.titulo)}</div><div class="m">${esc(x.motivo || "")}</div></li>`).join("")}
  </ul></div>`;
  el.innerHTML = h;
}

// ---------- Empleo ----------
const jobKey = (o) => "empleo:" + (safeUrl(o.url) || (o.empresa + "|" + o.puesto));
function renderEmpleo() {
  const r = pick("empleo"), el = $("#v-empleo");
  const saved = new Map();
  digests.filter(x => x.kind === "empleo").forEach(x => arr(x.data?.ofertas).forEach(o => { const k = jobKey(o); if (marks.get(k) === "guardada" && !saved.has(k)) saved.set(k, o); }));
  let h = head("empleo", "Empleo", jobFilter === "todas" ? r : null);
  h += `<div style="margin:0 0 14px"><div class="seg" role="group" aria-label="Qué ofertas ver">
    <button type="button" data-jf="todas" aria-pressed="${jobFilter === "todas"}">Del día</button>
    <button type="button" data-jf="guardadas" aria-pressed="${jobFilter === "guardadas"}">Guardadas${saved.size ? " · " + saved.size : ""}</button></div></div>`;
  let list = [];
  if (jobFilter === "guardadas") list = [...saved.values()];
  else {
    if (!r) { el.innerHTML = h + emptyBox(day === "latest" ? "Aún no hay búsqueda de empleo. Llega cada mañana." : "Ese día no hubo búsqueda de empleo."); return; }
    h += `<div class="glass panel"><p class="lede">${esc(r.data?.resumen || r.headline || "")}</p></div>`;
    list = arr(r.data?.ofertas);
  }
  if (!list.length) h += emptyBox(jobFilter === "guardadas" ? "Aún no has guardado ninguna oferta." : "Hoy no había ofertas que merezcan la pena.");
  const visible = list.filter(o => marks.get(jobKey(o)) !== "descartada");
  const hidden = list.length - visible.length;
  h += visible.map((o, idx) => {
    const k = jobKey(o), st = marks.get(k), u = safeUrl(o.url), jid = "job-" + idx;
    const tags = [o.nueva ? '<span class="label good">Nueva</span>' : "", ...arr(o.marcas).map(m => `<span class="label acc">${esc(m)}</span>`), o.tiro_largo ? '<span class="label">Tiro largo</span>' : "", o.ruta ? `<span class="label">${esc(o.ruta)}</span>` : ""].filter(Boolean).join("");
    return `<article class="glass job" aria-labelledby="${jid}">
      <div class="job-top">${logo(o)}<div><div class="who">${esc(o.empresa || "")}</div><p class="co">${esc(o.ciudad || "")}${o.publicada ? ` <span class="faint">· ${esc(o.publicada)}</span>` : ""}</p></div></div>
      ${tags ? `<div class="tags" style="margin-top:14px">${tags}</div>` : ""}
      <h3 id="${jid}">${esc(o.puesto || "Oferta")}</h3>
      ${o.por_que ? `<p class="why">${esc(o.por_que)}</p>` : ""}
      ${o.sueldo ? `<p class="money">${esc(o.sueldo)}</p>` : ""}
      ${(o.punto_flojo || o.condiciones) ? `<details><summary>Más detalles</summary><dl>
        ${o.punto_flojo ? `<dt>Ojo</dt><dd>${esc(o.punto_flojo)}</dd>` : ""}
        ${o.condiciones ? `<dt>Condiciones</dt><dd>${esc(o.condiciones)}</dd>` : ""}
      </dl></details>` : ""}
      <div class="actions">
        ${u ? `<a class="btn primary" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Ver oferta ${I.arrow}<span class="sr-only"> ${esc(o.puesto || "")}${NEWTAB}</span></a>` : ""}
        <button class="btn" type="button" data-mark="${esc(k)}" data-val="guardada" aria-pressed="${st === "guardada"}">${I.star}${st === "guardada" ? "Guardada" : "Guardar"}</button>
        <button class="btn" type="button" data-mark="${esc(k)}" data-val="descartada" aria-label="Descartar ${esc(o.puesto || "")}">Descartar</button>
      </div></article>`;
  }).join("");
  if (hidden) h += `<p class="small faint" style="text-align:center">${hidden} descartada${hidden > 1 ? "s" : ""}. <button class="linkish" type="button" data-undiscard="1">Mostrar</button></p>`;
  const li = jobFilter === "todas" && r ? arr(r.data?.linkedin_sin_verificar) : [];
  if (li.length) h += `<div class="glass panel"><p class="group-title">De tus alertas de LinkedIn · sin verificar</p><ul class="rows">${li.map(x => { const u = safeUrl(x.url); return `<li>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">` : ""}<div class="t">${esc(x.puesto || "Oferta")}</div><div class="m">${esc(x.empresa || "")}</div>${u ? NEWTAB + "</a>" : ""}</li>`; }).join("")}</ul></div>`;
  if (jobFilter === "todas" && r?.data?.notas) h += `<p class="tiny faint" style="margin:6px 4px 0">${esc(r.data.notas)}</p>`;
  el.innerHTML = h; el._list = list;
}

// ---------- Cambio ----------
function chartSVG(pts, avg) {
  if (pts.length < 3) return "";
  const W = 340, H = 170, P = { l: 4, r: 4, t: 18, b: 22 };
  const vals = pts.map(p => p[1]); const lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.1 || 0.001;
  const y0 = lo - pad, y1 = hi + pad;
  const X = i => P.l + (i / (pts.length - 1)) * (W - P.l - P.r);
  const Y = v => P.t + (1 - (v - y0) / (y1 - y0)) * (H - P.t - P.b);
  const path = pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
  const area = path + ` L${X(pts.length - 1).toFixed(1)} ${H - P.b} L${X(0).toFixed(1)} ${H - P.b} Z`;
  const last = pts[pts.length - 1];
  const f = (s) => new Date(s + "T12:00:00Z").toLocaleDateString("es-ES", { day: "numeric", month: "short", timeZone: "UTC" });
  const ya = avg != null ? Y(avg) : null;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="fxcap">
    <defs><linearGradient id="fxg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".25"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#fxg)"/>
    ${ya != null ? `<line x1="${P.l}" x2="${W - P.r}" y1="${ya.toFixed(1)}" y2="${ya.toFixed(1)}" stroke="var(--ink-3)" stroke-dasharray="3 4" stroke-width="1"/>` : ""}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(pts.length - 1).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="5" fill="var(--accent)" stroke="var(--glass-strong)" stroke-width="2.5"/>
    <text x="${P.l}" y="${P.t - 6}" font-size="11" fill="var(--ink-3)">máx ${num(hi)}</text>
    <text x="${P.l}" y="${H - 6}" font-size="11" fill="var(--ink-3)">${esc(f(pts[0][0]))}</text>
    <text x="${W - P.r}" y="${H - 6}" font-size="11" text-anchor="end" fill="var(--ink-3)">${esc(f(last[0]))}</text>
  </svg>`;
}
function renderCambio() {
  const r = pick("cambio"), el = $("#v-cambio");
  if (!r) { el.innerHTML = head("cambio", "Euro / dólar") + emptyBox(day === "latest" ? "Aún no hay datos del cambio. Llegan cada mañana con las noticias." : "Ese día no hubo datos del cambio."); return; }
  const d = r.data || {}, v = VERD[d.veredicto] || ["", ""];
  const N = (k) => toNum(d[k]);
  const pctl = N("pct_" + fxRange) != null ? Math.max(0, Math.min(100, N("pct_" + fxRange))) : null;
  const all = arr(d.serie).filter(p => Array.isArray(p) && toNum(p[1]) != null).map(p => [p[0], toNum(p[1])]);
  const serie = fxRange === 90 ? all.slice(-63) : all;
  const cls = (x) => x == null ? "" : x > 0 ? "up" : x < 0 ? "down" : "";
  let h = head("cambio", "Euro / dólar", r);
  h += `<div class="glass panel">
    <span class="label">1 euro cuesta</span>
    <div class="fx-big">${num(N("eur_usd"))}<span style="font-size:28px;letter-spacing:-.02em"> $</span></div>
    <div class="fx-unit">1 $ = ${num(N("usd_eur"))} €${d.fecha_dato && d.fecha_dato !== r.run_date ? ` <span class="faint">· dato del ${esc(dayLabel(d.fecha_dato, false).toLowerCase())}</span>` : ""}</div>
    <div class="verdict ${v[0]}" role="note"><div><strong>${esc(d.veredicto_texto || v[1] || "Sin veredicto")}</strong><span>${esc(d.razon || "")}</span></div></div>
    <div class="stats" aria-label="Cambio del euro">
      <div><b class="${cls(N("var_1d"))}">${pct(N("var_1d"))}</b><span>vs ayer</span></div>
      <div><b class="${cls(N("var_7d"))}">${pct(N("var_7d"))}</b><span>7 días</span></div>
      <div><b class="${cls(N("var_30d"))}">${pct(N("var_30d"))}</b><span>30 días</span></div>
    </div>
    <p class="tiny faint" style="margin:10px 0 0">Te conviene el euro barato: verde si baja, rojo si sube.</p>
  </div>
  <div class="glass panel">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px">
      <p class="group-title" style="margin:0">Histórico</p>
      <div class="seg" role="group" aria-label="Periodo"><button type="button" data-fx="90" aria-pressed="${fxRange === 90}">90 días</button><button type="button" data-fx="365" aria-pressed="${fxRange === 365}">1 año</button></div>
    </div>
    ${serie.length > 2 ? `<figure class="chart">${chartSVG(serie, N("media_" + fxRange))}<figcaption id="fxcap">Dólares por euro. La línea discontinua es la media del periodo (${num(N("media_" + fxRange))}).</figcaption></figure>` : `<p class="small faint">No hay histórico para dibujar la gráfica.</p>`}
    ${pctl !== null ? `<div class="meter"><p class="small" style="margin:0 0 10px">Hoy está en el <b>percentil ${Math.round(pctl)}</b> ${fxRange === 90 ? "de los últimos 90 días" : "del último año"}</p>
      <div class="meter-track" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pctl)}" aria-label="Percentil del cambio de hoy"><div class="meter-mark" style="left:${pctl}%"></div></div>
      <div class="meter-l"><span>Euro barato</span><span>Euro caro</span></div></div>` : ""}
    <div class="stats">
      <div><b>${num(N("media_" + (fxRange === 90 ? 30 : 90)))}</b><span>media ${fxRange === 90 ? "30" : "90"} d</span></div>
      <div><b>${num(N("min_" + fxRange))}</b><span>mínimo</span></div>
      <div><b>${num(N("max_" + fxRange))}</b><span>máximo</span></div>
    </div>
  </div>
  ${(d.tendencia || d.contexto) ? `<div class="glass panel">${d.tendencia ? `<p class="group-title">Tendencia</p><p style="margin:0 0 ${d.contexto ? "16px" : "0"}">${esc(d.tendencia)}</p>` : ""}${d.contexto ? `<p class="group-title">Esta semana</p><p style="margin:0">${esc(d.contexto)}</p>` : ""}</div>` : ""}
  <p class="tiny faint" style="margin:4px 4px 0">Lectura del histórico, no una predicción. Lo que pagas depende del tipo y la comisión de tu servicio de envío.${safeUrl(d.fuente_url) ? ` Fuente: <a style="color:var(--accent)" href="${esc(safeUrl(d.fuente_url))}" target="_blank" rel="noopener noreferrer">${esc(d.fuente_nombre || "ver")}${NEWTAB}</a>` : ""}</p>`;
  el.innerHTML = h;
}

// ---------- Interacción ----------
document.addEventListener("click", (e) => {
  const m = e.target.closest("[data-mark]");
  if (m) { e.preventDefault(); setMark(m.dataset.mark, m.dataset.val); if (m.dataset.val === "descartada") toast("Oferta descartada"); return; }
  const jf = e.target.closest("[data-jf]"); if (jf) { jobFilter = jf.dataset.jf; renderEmpleo(); return; }
  const fx = e.target.closest("[data-fx]"); if (fx) { fxRange = Number(fx.dataset.fx); renderCambio(); return; }
  const ns = e.target.closest("[data-ns]"); if (ns) { newsSec = Number(ns.dataset.ns); renderNoticias(); const b = $(`[data-ns="${newsSec}"]`); if (b) { b.focus({ preventScroll: true }); b.scrollIntoView({ inline: "center", block: "nearest" }); } return; }
  const ud = e.target.closest("[data-undiscard]");
  if (ud) (($("#v-empleo")._list) || []).forEach(o => { const k = jobKey(o); if (marks.get(k) === "descartada") setMark(k, "descartada"); });
});
$("#refreshBtn").addEventListener("click", async () => { await loadData(); toast("Actualizado"); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !$("#appView").hidden) loadData(); });

// ---------- Arranque ----------
(async function start() {
  if (!window.supabase) { document.body.innerHTML = '<p class="wrap" style="padding:40px 20px">No se pudo cargar. Revisa la conexión y recarga.</p>'; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "mi-pagina-auth" } });
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === "SIGNED_OUT") { digests = []; showLogin(); }
    else if (ev === "SIGNED_IN" && session && $("#appView").hidden) { showApp(); setView(location.hash.slice(1)); loadData(); }
  });
  const { data: { session } } = await sb.auth.getSession();
  if (session) { showApp(); setView(location.hash.slice(1)); loadData(); } else showLogin();
})();
</script>
